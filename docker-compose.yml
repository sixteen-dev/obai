version: '3.8'

services:
  # Qdrant disabled: educational-PDF search is not used and fundamentals-server
  # runs with QDRANT_ENABLED=false. To re-enable, uncomment this block, the
  # depends_on entry on fundamentals-server, the QDRANT_* env vars, and the
  # qdrant-data volume below — then set QDRANT_ENABLED=true on the server.
  # qdrant:
  #   image: qdrant/qdrant:v1.13.2
  #   container_name: obai-qdrant
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   volumes:
  #     - qdrant-data:/qdrant/storage
  #   networks:
  #     - obai-mcp-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 10s

  fundamentals-server:
    image: ghcr.io/sixteen-dev/obai/fundamentals-server:${OBAI_VERSION:-latest}
    build:
      context: ./src/fundamentals-server
      dockerfile: Dockerfile
    container_name: obai-fundamentals-server
    ports:
      - "8001:8000"
    environment:
      # API Keys (from host env: export FMP_API_KEY=... etc.)
      - FMP_API_KEY=${FMP_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Server Configuration
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8000
      - FMP_BASE_URL=https://financialmodelingprep.com/stable
      # Qdrant disabled: see qdrant service block above to re-enable.
      - QDRANT_ENABLED=false
      # - QDRANT_URL=http://qdrant:6333
      # - QDRANT_COLLECTION=financial-fundamentals
      - EMBEDDING_MODEL=text-embedding-3-small
      - EMBEDDING_DIMENSION=1536
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - obai-mcp-network
    restart: unless-stopped
    # depends_on:
    #   qdrant:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  market-data-server:
    image: ghcr.io/sixteen-dev/obai/market-data-server:${OBAI_VERSION:-latest}
    build:
      context: ./src/market-data-server
      dockerfile: Dockerfile
    container_name: obai-market-data-server
    ports:
      - "8002:8000"
    environment:
      # API Keys (from host env)
      - FMP_API_KEY=${FMP_API_KEY}
      # Server Configuration
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8000
      - FMP_BASE_URL=https://financialmodelingprep.com/stable
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - obai-mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  events-news-server:
    image: ghcr.io/sixteen-dev/obai/events-news-server:${OBAI_VERSION:-latest}
    build:
      context: ./src/events-news-server
      dockerfile: Dockerfile
    container_name: obai-events-news-server
    ports:
      - "8003:8000"
    environment:
      # API Keys (from host env: export FMP_API_KEY=... etc.)
      - FMP_API_KEY=${FMP_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Server Configuration
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8000
      - FMP_BASE_URL=https://financialmodelingprep.com/stable
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - obai-mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  options-server:
    image: ghcr.io/sixteen-dev/obai/options-server:${OBAI_VERSION:-latest}
    build:
      context: ./src/options-server
      dockerfile: Dockerfile
    container_name: obai-options-server
    ports:
      - "8004:8000"
    environment:
      # API Keys (from host env)
      - MASSIVE_API_KEY=${MASSIVE_API_KEY}
      # Server Configuration
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8000
      - MASSIVE_BASE_URL=https://api.massive.com
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - obai-mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  screening-server:
    image: ghcr.io/sixteen-dev/obai/screening-server:${OBAI_VERSION:-latest}
    build:
      context: ./src/screening-server
      dockerfile: Dockerfile
    container_name: obai-screening-server
    ports:
      - "8005:8000"
    environment:
      # API Keys (from host env)
      - FMP_API_KEY=${FMP_API_KEY}
      # Server Configuration
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8000
      - FMP_BASE_URL=https://financialmodelingprep.com/stable
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - obai-mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  portfolio-server:
    image: ghcr.io/sixteen-dev/obai/portfolio-server:${OBAI_VERSION:-latest}
    build:
      context: ./src/portfolio-server
      dockerfile: Dockerfile
    container_name: obai-portfolio-server
    ports:
      - "8006:8000"
    environment:
      # API Keys (from host env)
      - FMP_API_KEY=${FMP_API_KEY}
      # Server Configuration
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8000
      - FMP_BASE_URL=https://financialmodelingprep.com/stable
      # Cache TTLs (hours)
      - ETF_HOLDINGS_CACHE_TTL_HOURS=24
      - TREASURY_RATES_CACHE_TTL_HOURS=4
      - ECONOMIC_INDICATORS_CACHE_TTL_HOURS=4
      # Market Data Server (for price data)
      - MARKET_DATA_SERVER_URL=http://market-data-server:8000
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - obai-mcp-network
    restart: unless-stopped
    depends_on:
      - market-data-server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backtest-server:
    image: ghcr.io/sixteen-dev/obai/backtest-server:${OBAI_VERSION:-latest}
    build:
      context: ./src/backtest-server
      dockerfile: Dockerfile
    container_name: obai-backtest-server
    ports:
      - "8007:8007"
    environment:
      # API Keys (from host env)
      - FMP_API_KEY=${FMP_API_KEY}
      # Server Configuration
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8007
    volumes:
      # Persist OHLCV data and cache across restarts
      - backtest-data:/app/data
    # Must stay above config.py's duckdb_memory_limit (4GB) plus polars/numpy
    # headroom. The old 2g cap sat below it, so DuckDB would not spill until 4GB
    # while the cgroup killed the container at 2GiB.
    mem_limit: 6g
    memswap_limit: 6g
    networks:
      - obai-mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  research-server:
    image: ghcr.io/sixteen-dev/obai/research-server:${OBAI_VERSION:-latest}
    build:
      context: ./src/research-server
      dockerfile: Dockerfile
    container_name: obai-research-server
    ports:
      - "8008:8008"
    environment:
      # API Keys (from host env)
      - EXA_API_KEY=${EXA_API_KEY}
      # Server Configuration
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8008
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - obai-mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prediction-markets-server:
    image: ghcr.io/sixteen-dev/obai/prediction-markets-server:${OBAI_VERSION:-latest}
    build:
      context: ./src/prediction-markets-server
      dockerfile: Dockerfile
    container_name: obai-prediction-markets-server
    ports:
      - "8009:8009"
    environment:
      # No API keys required — Polymarket APIs are public
      # Server Configuration
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8009
    volumes:
      # Persist DuckDB cache (market metadata + CLOB price history) across restarts.
      # Without this, every container restart wipes the cache and cold-cache backfill
      # of historical-analytics tools (backtest_prediction_rule, etc.) hangs the MCP call.
      - prediction-data:/app/data
    mem_limit: 1g
    memswap_limit: 1g
    networks:
      - obai-mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  crypto-server:
    image: ghcr.io/sixteen-dev/obai/crypto-server:${OBAI_VERSION:-latest}
    build:
      context: ./src/crypto-server
      dockerfile: Dockerfile
    container_name: obai-crypto-server
    ports:
      - "8010:8010"
    environment:
      # No Coinbase keys required — v1 uses public Advanced Trade market data
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8010
      - COINBASE_MARKET_BASE_URL=https://api.coinbase.com/api/v3/brokerage/market
    volumes:
      - crypto-data:/app/data
    mem_limit: 1g
    memswap_limit: 1g
    networks:
      - obai-mcp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  # qdrant-data:  # disabled with the qdrant service above
  backtest-data:
  prediction-data:
  crypto-data:

networks:
  obai-mcp-network:
    driver: bridge
