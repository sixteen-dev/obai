[project]
name = "prediction-markets-server"
version = "0.3.0"
description = "MCP server for Polymarket prediction market analysis"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.4",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.1",
    "structlog>=25.1.0",
    "duckdb>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit (security)
    "D",      # pydocstyle
    "PL",     # Pylint
]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any)
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D203",    # 1 blank line required before class docstring (conflicts with D211)
    "D213",    # Multi-line docstring summary should start at the second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "D101", "D102", "D103", "ANN001", "ANN201", "ANN202", "PLR2004", "PLC0415"]
"src/clients/*" = ["PLR0913", "PLR2004"]
"src/data/*" = ["PLR0913", "PLR2004"]
"src/storage/*" = ["PLR0913"]
"src/engine/*" = ["PLR0913", "S311"]
"src/server.py" = ["PLR0913"]
"src/tools/*" = ["PLR0913", "PLR2004", "PLR0912", "PLR0915"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.19.1",
    "ruff>=0.14.13",
]

[tool.uv]
constraint-dependencies = ["authlib>=1.7.2", "urllib3>=2.7.0"]
