[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clients", "core_agents", "evaluation"]

[tool.hatch.build.targets.wheel.force-include]
"clients/web/static" = "clients/web/static"

[tool.hatch.build]
exclude = [
    "*.log",
    ".env*",
    "**/tests/",
    "**/test_*.py",
    "**/test_cases/",
]

[project]
name = "obai"
version = "1.5.3"
description = "OBaI - Multi-agent financial research agent (agents + clients bundled)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.15.0",
    "openai-agents>=0.17.3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "fastmcp>=2.14.3",
    "textual>=3.0.0",
    "typer>=0.12.0",
    "opik>=2.0.23",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
]

[project.scripts]
obai = "clients.cli.chat:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]
testing = [
    "deepeval>=2.0.0",
    "pyyaml>=6.0.0",
]
caching = [
    "langcache>=0.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "D",   # pydocstyle
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "S101", # Use of assert (fine in tests)
    "ANN401", # Dynamically typed Any (needed for __aexit__ signature)
]

[tool.ruff.lint.per-file-ignores]
# Allow long lines in instruction strings (agent prompts)
"*_agent.py" = ["E501"]
# Tests use assert statements and have different patterns
"tests/*" = ["S101", "ANN", "ANN003", "ANN202", "D102"]
"core_agents/tests/*" = ["S101", "ANN", "ANN003", "ANN202", "D102"]
"clients/web/tests/*" = ["S101", "ANN", "ANN003", "ANN202", "D102"]
# Evaluation module has CLI and may use assert for validation
"evaluation/*" = ["S101", "ANN401"]
# CLI needs sys.path modification before local imports
"evaluation/cli.py" = ["S101", "ANN401", "E402"]
# CLI clients may have local imports after sys.path modification
"clients/cli/tui.py" = ["E402"]
"clients/cli/chat.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core_agents/tests", "clients/web/tests"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { pydantic-settings = "0 days", litellm = "0 days", aiohttp = "0 days", fastmcp = "0 days", pygments = "0 days", cryptography = "0 days", requests = "0 days", pytest = "0 days", pillow = "0 days", python-multipart = "0 days", authlib = "0 days", openai-agents = "0 days", opik = "0 days", urllib3 = "0 days", starlette = "0 days", idna = "0 days" }
constraint-dependencies = ["pyjwt>=2.13.0", "joserfc>=1.6.8", "aiohttp>=3.14.0", "requests>=2.33.0", "cryptography>=48.0.1", "pillow>=12.2.0", "python-multipart>=0.0.31", "authlib>=1.7.2", "urllib3>=2.7.0", "starlette>=1.3.1", "idna>=3.15"]
override-dependencies = ["litellm==1.85.0", "python-dotenv>=1.1.0"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
    "types-cachetools>=6.2.0.20260317",
    "types-pyyaml>=6.0.12.20250915",
]
