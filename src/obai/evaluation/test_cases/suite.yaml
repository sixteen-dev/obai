    category: D
    query_type: error_ticker_typo_fallback
    expected_tools: [market_data_analysis, screener_lookup]
    expected_sequence: [market_data_analysis, screener_lookup]
    expected_outcome: success
    allowed_partial_errors:
      - tool: market_data_analysis
        error_pattern: '(?i)(?:AAPLL|invalid|unknown|not found).{0,100}(?:symbol|ticker|AAPLL)|(?:symbol|ticker).{0,100}(?:AAPLL|invalid|unknown|not found)'
        response_pattern: '(?is)(?=.*\bAAPLL\b.{0,100}(?:typo|invalid|unknown|not found))(?=.*\bAAPL\b)'
        forbidden_response_pattern: '(?i)\bAAPLL\b.{0,40}\b(?:is|was) (?:correct|valid)\b|\bnot AAPL\b|\bno typo\b'
    date_policy: live
    description: Price lookup should fail then trigger typo-resolution fallback

