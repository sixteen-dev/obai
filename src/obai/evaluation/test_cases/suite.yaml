# OBaI Evaluation Test Suite
# ==========================
# 210 test cases across 8 active categories (A-E, G-I; F pending):
# 185 default rows and 25 extended-only rows requiring explicit opt-in.
# Category F (session/context) requires multi-turn support — listed as comments.
# Category G: New capabilities — portfolio risk/allocation, options analytics,
#   prediction markets,
# Category H: Deep company research — Exa-powered research agent queries.
#   walk-forward validation, shared-capital backtesting, commodities, expanded indicators.
#
# Usage:
#   python -m evaluation evaluate --suite                    # Run 185 default rows
#   python -m evaluation evaluate --suite --ids A1,B3        # Surgical paid selection
#   python -m evaluation evaluate --suite --include-extended # Run all 210 (expensive)
#   python -m evaluation evaluate --suite --category A       # Single-agent only
#   python -m evaluation evaluate --suite --file custom.yaml # Custom file

