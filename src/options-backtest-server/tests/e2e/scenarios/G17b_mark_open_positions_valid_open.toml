# G17b: G17a's market under end_policy mark_open_positions (C36). No FINAL order is submitted;
# the held package is marked at the final CLOSE and the run is valid with an open position:
# final equity is the mid NLV, and an open run is never headline-eligible.
id = "G17b"
proves = ["C36"]
derived_by = "C2"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-06" }
strategy = { file = "spxw_put_credit_vertical.json", patch = { end_policy = "mark_open_positions" } }

[market]
# defaults.toml unchanged.

[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4900"
session = "2024-03-04"
slots = ["DEC", "F1"]
bid = "2.00"
ask = "2.20"
bid_size = 50
ask_size = 50

[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4895"
session = "2024-03-04"
slots = ["DEC", "F1"]
bid = "1.00"
ask = "1.10"
bid_size = 50
ask_size = 50

# As G17a; nothing reads these slots here, since no order is submitted on the final session.
[[market.overrides]]
kind = "quote_drop"
contract = "SPXW:2024-03-15:P:4900"
session = "2024-03-06"
slots = ["F1", "F2", "F3"]

# Final CLOSE marks, read by mid_nlv, natural_nlv and final_equity_usd (item 45).
[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4900"
session = "2024-03-06"
slots = ["CLOSE"]
bid = "1.50"
ask = "1.70"
bid_size = 50
ask_size = 50

[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4895"
session = "2024-03-06"
slots = ["CLOSE"]
bid = "0.70"
ask = "0.80"
bid_size = 50
ask_size = 50

[expected]
