headline_eligible = false
final_equity_usd = "10003.00"
warning_codes = ["SYNTHETIC_FIXTURE_NOT_HISTORICAL"]
open_positions = [["SPXW:2024-03-15:P:4895", 1], ["SPXW:2024-03-15:P:4900", -1]]
retired_contracts = []
derivation = """
Conventions as G01 (m = 100, $1.00 per contract side, T+1, S = 5000.00, DF = 1).
P4900 = SPXW:2024-03-15:P:4900, P4895 = SPXW:2024-03-15:P:4895. take_profit and stop_loss null,
exit_dte 0, max_holding_sessions 252, end_policy mark_open_positions; final session 2024-03-06.

2024-03-04: entry as G01: D = -90, fees 2, limit -90, basis 90.
Account 2024-03-04: cash 10000; receivable 90; payable 2; encumbrance 502; headroom 9496.
2024-03-05 OPEN: cash 10088. DEC: dte 10, held session 2: no trigger -> hold.
2024-03-06 DEC (final session): mark_open_positions submits no FINAL; dte 9 > 0, held session
  3 < 252, no profit rules -> no trigger -> no order. No fill slot is read.
2024-03-06 CLOSE (pins): mids P4900 (1.50 + 1.70)/2 = 1.60, P4895 (0.70 + 0.80)/2 = 0.75.
  mid_nlv = 10088 + 0 - 0 + 100*(-1*1.60 + 1*0.75) = 10088 - 85 = 10003.
  natural_nlv (short at ask, long at bid) = 10088 + 100*(-1*1.70 + 1*0.70) = 10088 - 100 = 9988.
Account 2024-03-06: cash 10088; receivable 0; payable 0; encumbrance 502; headroom 9586;
  mid_nlv 10003; natural_nlv 9988.
End: valid (an open position is allowed under mark_open_positions); final_equity_usd =
  mid_nlv(2024-03-06) = 10003; headline_eligible false (a position is open).
  open_positions, sorted by contract id: [(P4895, +1), (P4900, -1)]. Nothing retired.
Campaign c1: OPEN, end_session and exit_trigger null; basis 90, realized_pnl 0, fees 2.
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL only.
"""

