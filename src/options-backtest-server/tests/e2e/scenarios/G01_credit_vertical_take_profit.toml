derivation = """
Conventions: m = 100; fee $1.00 per contract per traded side, $0 settlement; premiums and fees
settle T+1 (next table session); zero interest. S = 5000.00 at every slot (zero drift and vol);
DF = 1 (zero rates). P4900 = SPXW:2024-03-15:P:4900, P4895 = SPXW:2024-03-15:P:4895.

2024-03-04 DEC (Monday; weekly weekday 1; not final): flat, no conditions -> ENTRY selection.
  Expiry: 2024-03-15 only, dte = 11 in [9, 13], 11 > exit_dte 0.
  short_put: |Decimal(4900.0/5000.0) - 0.98| ~ 1.8e-17 <= 0.0005; 4895 and 4905 miss by ~0.001.
  long_put: 4900 + (-5) = 4895 (strike_offset). Spreads 0.20, 0.10 <= 0.50; bids > 0.
  D(1) = 100*(-1*2.00) + 100*(+1*1.10) = -200 + 110 = -90; Q*D = (-1)*(-90) = 90 > 0.
  fees(1) = 2 legs * 1 * 1.00 = 2.
  risk: payoff min (S <= 4895) = 100*(-(4900 - S) + (4895 - S)) = -500; entry_cash = 90 - 2 = 88;
    -(-500 + 88) + provision 2*1*max(1.00, 0) = 412 + 2 = 414 <= 0.10 * 10000 = 1000.
  preview headroom = 10000 - 2 - (500 + 2) = 9496 >= 0; capacity floor(min(50, 50)*0.10) = 5 >= 1.
  limit = D(1) + price_allowance 0.00 = -90.
2024-03-04 F1 (pins = DEC): D = -90 <= -90 -> fill; net_debit -90.00, fees 2.00, basis |-90| = 90.
Account 2024-03-04 (CUT): cash 10000 (flows settle 2024-03-05); receivable 90; payable 2;
  encumbrance = width 5 * m * 1 + fee provision 2 = 502; headroom = 10000 - 2 - 502 = 9496;
  mid_nlv = 10000 + 90 - 2 + 100*(-1*2.10 + 1*1.05) = 10088 - 105 = 9983 (CLOSE mids 2.10, 1.05);
  natural_nlv = 10088 + 100*(-1*2.20 + 1*1.00) = 10088 - 120 = 9968 (short at ask, long at bid).
2024-03-05 OPEN: dues through 2024-03-05 settle: cash = 10000 + 90 - 2 = 10088.
2024-03-05 DEC: held session 2 < 252; dte 10 > 0; close legs (P4900 +1, P4895 -1):
  close D = 100*1.20 - 100*0.40 = 80; exit fees 2; entry_debit_incl_fees = -90 + 2 = -88;
  LiquidationPnL = 0 - (-88) - 80 - 2 = 6 >= 0.05 * 90 = 4.5 -> EXIT (TAKE_PROFIT); limit 80 + 0.00 = 80.
2024-03-05 F1 (pins = DEC): D = 80 <= 80 -> fill; net_debit 80.00, fees 2.00.
  post-fill headroom = 10088 - (80 + 2) - 0 = 10006 >= 0.
Account 2024-03-05: cash 10088; receivable 0; payable 80 + 2 = 82; encumbrance 0 (flat);
  headroom = 10088 - 82 = 10006; mid_nlv = natural_nlv = 10088 - 82 = 10006.
2024-03-06 (final; Wednesday, unscheduled, flat -> no decision): OPEN cash = 10088 - 82 = 10006;
  account cash 10006, payable 0, headroom 10006, mid_nlv 10006.
final_equity_usd = mid_nlv(2024-03-06) = 10006; headline_eligible: valid and flat; no dues remain.
Campaign c1 (one generation c1.g1): basis 90;
  REALIZED_PNL[P4900] = -(200 - 120) = -80, REALIZED_PNL[P4895] = +(110 - 40) = +70;
  realized_pnl = -(-80 + 70) = 10; fees = 2 + 2 = 4; net = 10 - 4 = 6 = 10006 - 10000 (F01).
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL only.
"""

