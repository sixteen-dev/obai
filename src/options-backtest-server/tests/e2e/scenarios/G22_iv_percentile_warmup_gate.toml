2024-02-22 DEC (index 253): the gate reads index 252's value (visible since 2024-02-21 16:00),
  in [0, 100] -> gte 0 holds. (2024-02-22's own value is visible only at its 16:00 CLOSE.)
  Expiries: 2024-03-04 dte 11 in [9, 13] (2024-02-05 expired; 2024-04-01 dte 39).
  short_put: |Decimal(4925.0/5000.0) - 0.985| ~ 0 <= 0.0005; 4900 and 4950 miss by 0.005.
  long_put: 4925 - 25 = 4900. Spreads 0.20 and 0.10.
  D(1) = 100*(-2.00) + 100*1.10 = -90; Q*D = 90 > 0; fees 2.
  risk: payoff min = 100*(-25) = -2500; -(-2500 + 88) + 2 = 2414 <= 0.25 * 10000 = 2500.
  preview headroom = 10000 - 2 - (2500 + 2) = 7496 >= 0; capacity 5 >= 1; limit -90.
2024-02-22 F1 (pins): fill at D = -90, fees 2; basis 90.
Account 2024-02-22: cash 10000; receivable 90; payable 2; encumbrance 2502; headroom 7496.
2024-02-23 OPEN: cash 10088. DEC: held session 2 >= max_holding_sessions 2 -> TIME_EXIT;
