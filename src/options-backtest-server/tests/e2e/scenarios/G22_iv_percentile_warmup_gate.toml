Expiries every 28 days from 2023-03-06 (all Mondays) through offset 392 = 2024-04-01 >=
last_session + 30 days (offset 389), so every session has expiries bracketing 30 days.
Strategy: daily schedule; condition SPX:options.atm30_iv_percentile_252s gte 0 (in [0, 100]
whenever defined); short put moneyness 0.985 (tolerance 0.0005), long put 25 below;
max_holding_sessions 2; fractions 0.25; take_profit and stop_loss null.
P4925 = SPXW:2024-03-04:P:4925, P4900 = SPXW:2024-03-04:P:4900.

Feature visibility: a session's value is visible from its CLOSE (max_input_available_at_ns), so
the gate at a session's DEC reads the previous table session's value. The percentile of index i
needs the 252 preceding sessions all valid: index 251 -> None (warmup); index 252 -> a value.

2024-02-21 DEC (index 252; daily, flat, not final): the gate reads index 251's value: None
