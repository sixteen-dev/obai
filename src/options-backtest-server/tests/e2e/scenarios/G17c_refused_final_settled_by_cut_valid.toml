retired_contracts = ["SPXW:2024-03-15:P:4895", "SPXW:2024-03-15:P:4900"]
derivation = """
Conventions as G01, except initial cash 600.00 and both risk fractions 1 (as G06).
P4900 = SPXW:2024-03-15:P:4900, P4895 = SPXW:2024-03-15:P:4895. end_policy
liquidate_at_final_session; final session 2024-03-15 (also the expiry date).

2024-03-04 DEC: entry as G06: D(1) = -90, fees 2; risk 414 <= 600; preview headroom
  600 - 2 - 502 = 96 >= 0; limit -90. F1: fill at D = -90, fees 2.
Account 2024-03-04: cash 600; receivable 90; payable 2; encumbrance 502; headroom 96.
2024-03-05 OPEN: cash = 600 + 90 - 2 = 688; headroom = 688 - 502 = 186.
2024-03-05 .. 2024-03-14: dte 10..1 > 0, held sessions < 252, no profit rules: hold.
2024-03-15 DEC (final session): held under liquidate_at_final_session -> FINAL (whatever the
  DEC quotes; market-style, no limit); legs P4900 +1, P4895 -1.
2024-03-15 F1, F2, F3 (pins): fresh VALID quotes; D = 100*7.50 - 100*0.40 = 710; no limit;
  capacity floor(min(50, 50)*0.10) = 5 >= 1; post-fill: CASH 688, PAYABLE 710 + 2 = 712, no
  lots -> headroom = 688 - 712 = -24 < 0 -> INSUFFICIENT_CAPITAL (net_debit 710.00) at each
  attempt; one INSUFFICIENT_CAPITAL warning (the order's first refusal); the F3 nonfill cancels
  the order: EXIT_UNFILLED. The package is still held and expires today (no CLOSE quote).
2024-03-15 CUT: SPX_PM 4897.00 (pin), s:SPX_PM:2024-03-15:c0: P4900 (q -1) pays
  100*(4900 - 4897) = 300, P4895 (q +1) 0; net_cash -300, fees 0 -> PAYABLE[2024-03-18] 300;
  both contracts retire; the entry carries input_refs (s:SPX_PM:2024-03-15:c0).
Account 2024-03-15: cash 688; receivable 0; payable 300; encumbrance 0; headroom 388;
  mid_nlv = natural_nlv = 688 - 300 = 388 (flat).
End: the refused FINAL left nothing held after the final session, because settlement at its
  CUT extinguished the package -> VALID, flat, headline-eligible; final_equity_usd =
  mid_nlv(2024-03-15) = 388.
2024-03-18 (settle-only): OPEN SETTLE_DUE: cash = 688 - 300 = 388; account cash 388, payable 0,
  headroom 388, mid_nlv 388.
Campaign c1: REALIZED_PNL[P4900] = -200 + 300 = +100, [P4895] = +110; realized_pnl = -210;
  fees 2; net -212 = 388 - 600; SETTLED at 2024-03-15, exit_trigger settlement.
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL, INSUFFICIENT_CAPITAL (F1), EXIT_UNFILLED (F3).
"""

