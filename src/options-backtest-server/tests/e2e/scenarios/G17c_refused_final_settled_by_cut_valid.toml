proves = ["C36"]
derived_by = "C2"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-15" }
strategy = { file = "spxw_put_credit_vertical.json", patch = { account = { initial_cash_usd = "600.00", max_campaign_risk_fraction = 1, max_total_risk_fraction = 1 } } }

[market]
# defaults.toml unchanged; take-profit and stop-loss null.

