# G20: risk_budget sizing counts down from its cap (§8 item 6). Three packages pass the risk
# test and the preview headroom, but the short put's displayed bid size allows only two, so the
# entry is sized at two: the decision capacity binds, not the budget.
id = "G20"
proves = ["sizing"]
derived_by = "C2"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-06" }
strategy = { file = "spxw_put_credit_vertical_risk_budget.json", patch = { exits = { take_profit = { basis = "initial_credit", fraction = 0.05 } } } }

[market]
# defaults.toml unchanged.

# The sold leg's bid size is 25: floor(25 * 0.10) = 2 packages at most.
[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4900"
session = "2024-03-04"
slots = ["DEC", "F1"]
bid = "2.00"
ask = "2.20"
bid_size = 25
ask_size = 50

[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4895"
session = "2024-03-04"
slots = ["DEC", "F1"]
bid = "1.00"
ask = "1.10"
bid_size = 50
ask_size = 50

[[market.overrides]]
