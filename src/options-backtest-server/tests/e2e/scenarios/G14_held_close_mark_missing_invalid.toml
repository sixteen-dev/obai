# G14 (full window): a held leg without a valid CLOSE mark invalidates the run (C35). The loop stops
# at that CLOSE; the run is neither truncated to its earlier sessions nor marked at zero. Its
# shorter-window twin, G14_shorter_window_rerun_valid.toml, has the same strategy and market.
id = "G14"
proves = ["C35"]
derived_by = "C2"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-07" }
strategy = { file = "spxw_put_credit_vertical.json" }

[market]
# defaults.toml unchanged. The market is identical in both G14 files.

[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4900"
session = "2024-03-04"
slots = ["DEC", "F1"]
bid = "2.00"
ask = "2.20"
bid_size = 50
ask_size = 50

[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4895"
session = "2024-03-04"
slots = ["DEC", "F1"]
bid = "1.00"
ask = "1.10"
bid_size = 50
ask_size = 50

# 2024-03-05 F1: read only by the shorter run, whose final session this is (FINAL fill).
[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4900"
session = "2024-03-05"
slots = ["F1"]
bid = "1.00"
ask = "1.20"
bid_size = 50
