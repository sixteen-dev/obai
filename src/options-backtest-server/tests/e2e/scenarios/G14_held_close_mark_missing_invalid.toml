# 2024-03-06 CLOSE: the long put's mark is missing.
[[market.overrides]]
kind = "quote_drop"
contract = "SPXW:2024-03-15:P:4895"
session = "2024-03-06"
slots = ["CLOSE"]

[expected]
calculation_status = "invalid"
headline_eligible = false
warning_codes = ["SYNTHETIC_FIXTURE_NOT_HISTORICAL"]
derivation = """
Conventions as G01 (m = 100, $1.00 per contract side, T+1, S = 5000.00, DF = 1).
P4900 = SPXW:2024-03-15:P:4900, P4895 = SPXW:2024-03-15:P:4895. take_profit and stop_loss null,
exit_dte 0, max_holding_sessions 252, liquidate_at_final_session; final session 2024-03-07.

2024-03-04: ENTRY as G01: D = 100*(-2.00) + 100*1.10 = -90, fees 2, limit -90; fill at F1.
Account 2024-03-04: cash 10000; receivable 90; payable 2; encumbrance 500 + 2 = 502;
  headroom = 10000 - 2 - 502 = 9496.
2024-03-05 OPEN: cash = 10000 + 90 - 2 = 10088. DEC: not final; dte 10 > 0, held session 2 < 252,
  no profit rules -> no trigger -> hold (the F1 pins of this session are never read here).
  CLOSE: both legs marked from generated quotes (at most 120 s old, VALID or NO_BID).
Account 2024-03-05: cash 10088; receivable 0; payable 0; encumbrance 502; headroom 9586.
2024-03-06 DEC: dte 9, held session 3: no trigger -> hold.
2024-03-06 CLOSE: P4895 is held and unexpired (expiry 2024-03-15 > 2024-03-06); its CLOSE
  observation is dropped, so its latest visible quote of the session is F3's (15:48), 720 s old
  > 120 s -> no mark -> INVALIDATED (MISSING_VALUATION). The loop stops: no 2024-03-06 SNAPSHOT,
  no 2024-03-07 session, final equity null, no headline. No mark is zero-filled and the run is
  not cut back to its last complete session (the shorter window is a separate run, its twin).
Campaign c1: still held when the run stopped -> INCOMPLETE, end_session and exit_trigger null;
  basis 90; realized_pnl = -ΣREALIZED_PNL = 0 (an opening realizes nothing); fees 2; rolls 0.
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL only (invalidity is an invalid reason, not a warning).
"""

