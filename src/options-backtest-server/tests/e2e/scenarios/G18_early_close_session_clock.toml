# G18: a 13:00 early close moves the whole slot program (C06). On the genuine early-close
# session 2024-03-04 the entry decides at 12:45 and fills at 12:46 from quotes generated at those
# instants. On 2024-03-11, made a 13:00 session by the EarlyClose override while its data stay at
# regular hours (phantom post-close data), the 12:45 decision sees no spot and skips: no quote
# observed after the close is ever used.
id = "G18"
proves = ["C06"]
derived_by = "C2"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-12" }
strategy = { file = "spxw_put_credit_vertical.json", patch = { exits = { take_profit = { basis = "initial_credit", fraction = 0.05 } } } }

[market]
early_closes = ["2024-03-04"]  # generated as a genuine 13:00 session: DEC 12:45, F1 12:46 ...
weekly_dtes = [11, 18]         # 2024-03-15 and 2024-03-22 (both Fridays)

[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4900"
session = "2024-03-04"
slots = ["DEC", "F1"]
bid = "2.00"
ask = "2.20"
bid_size = 50
ask_size = 50

[[market.overrides]]
