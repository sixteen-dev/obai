# 2024-03-11: the session table closes at 13:00; its generated data stay at 15:45 ... 16:00.
[[market.overrides]]
kind = "early_close"
session = "2024-03-11"

[expected]
calculation_status = "valid"
headline_eligible = true
final_equity_usd = "10006.00"
warning_codes = ["SYNTHETIC_FIXTURE_NOT_HISTORICAL", "PRICING_INPUT_UNAVAILABLE"]
open_positions = []
derivation = """
Conventions as G01 (m = 100, $1.00 per contract side, T+1, S = 5000.00, DF = 1).
P4900 = SPXW:2024-03-15:P:4900, P4895 = SPXW:2024-03-15:P:4895. Slots on a 13:00 session:
DEC 12:45, F1 12:46, F2 12:47, F3 12:48, CLOSE 13:00, CUT 23:59:59 (America/New_York).
Weekly entry on Mondays; take_profit 0.05 of initial credit.

2024-03-04 DEC 12:45 (early close; Monday; flat): expiries 2024-03-15 (dte 11, in [9, 13]) and
  2024-03-22 (dte 18, out). Spot = the 12:45 INDEX_VALUE 5000.00 (0 s old <= 60 s); zero rates
  (available at this DEC); F from the generated 12:45 quotes of the five nearest strikes.
  Entry as G01 from the 12:45 pins: D = -90, fees 2, limit -90.
2024-03-04 F1 12:46: pins, observed 12:46 > 12:45 -> fill: net_debit -90.00, fees 2.00.
2024-03-04 CLOSE 13:00: both legs marked from their generated 13:00 quotes.
Account 2024-03-04: cash 10000; receivable 90; payable 2; encumbrance 502; headroom 9496.
2024-03-05 (regular session): as G01: DEC LiquidationPnL = 0 + 88 - 80 - 2 = 6 >= 4.5 ->
  EXIT (TAKE_PROFIT), limit 80; F1 fill at D = 80, fees 2.
Account 2024-03-05: cash 10088; receivable 0; payable 82; encumbrance 0; headroom 10006;
  mid_nlv 10006.
2024-03-06 .. 2024-03-08: unscheduled, flat: no decision. 2024-03-06 OPEN: cash 10006.
2024-03-11 DEC 12:45 (EarlyClose override; Monday, scheduled, flat, not final): expiries
  2024-03-15 (dte 4, out) and 2024-03-22 (dte 11, in). The view reads only 2024-03-11's own
  index values (item 11: never across a session, so 2024-03-08's are never candidates), and
  those (15:45 ... 16:00) are observed after its 13:00 close, so none is visible at 12:45 ->
  spot unavailable (the session's curve, available at the generated 15:45 DEC, is too) -> expiry
  2024-03-22 skipped with PRICING_INPUT_UNAVAILABLE (warning); no package -> ENTRY_SKIPPED.
  [Ccheck: the earlier text had the view see 2024-03-08's 16:00 value and reject it for age;
  item 11 excludes it outright. Same outcome, no expected value changes.]
  Nothing observed after 13:00 decides, fills or marks anything on 2024-03-11.
2024-03-12 (final; Tuesday, unscheduled, flat): no decision.
Account 2024-03-12: cash 10006; payable 0; headroom 10006; mid_nlv 10006.
final_equity_usd = 10006.
Campaign c1: basis 90; realized_pnl = -(-80 + 70) = 10; fees 4; closed by take_profit.
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL, PRICING_INPUT_UNAVAILABLE (2024-03-11).
"""

