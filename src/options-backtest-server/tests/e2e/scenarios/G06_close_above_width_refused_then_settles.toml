headline_eligible = true
final_equity_usd = "388.00"
warning_codes = ["SYNTHETIC_FIXTURE_NOT_HISTORICAL", "INSUFFICIENT_CAPITAL", "EXIT_UNFILLED"]
open_positions = []
retired_contracts = ["SPXW:2024-03-15:P:4895", "SPXW:2024-03-15:P:4900"]
derivation = """
Conventions as G01, except initial cash 600.00 and both risk fractions 1.
P4900 = SPXW:2024-03-15:P:4900, P4895 = SPXW:2024-03-15:P:4895.

2024-03-04 DEC: entry as G01: D(1) = -200 + 110 = -90, fees 2; risk 412 + 2 = 414 <= 1 * 600;
  preview headroom = 600 - 2 - (500 + 2) = 96 >= 0; limit -90.
2024-03-04 F1: fill at D = -90, fees 2; post-fill headroom 96 >= 0.
Account 2024-03-04: cash 600; receivable 90; payable 2; encumbrance 502; headroom 96.
2024-03-05 OPEN: cash = 600 + 90 - 2 = 688; headroom = 688 - 502 = 186 at every later DEC.
2024-03-15 DEC (expiry, not final): dte 0 <= 0 -> TIME_EXIT; both closing sides usable (P4900 buy
  at ask 7.50, P4895 sell at bid 0.40) -> EXIT; close D = 100*7.50 - 100*0.40 = 750 - 40 = 710
  (> width reserve 5*100 = 500); limit 710 + 0.00 = 710. Package mid = (4.00 + 7.50)/2 -
  (0.40 + 1.60)/2 = 5.75 - 1.00 = 4.75, inside [0, 5], so mid NLV = 688 + 100*(-5.75 + 1.00)
  = 213 >= 0. Closing orders pass no spread gate.
2024-03-15 F1, F2, F3: D = 710 <= 710; capacity floor(min(50, 50)*0.10) = 5 >= 1; post-fill state:
  CASH 688, PAYABLE = -(710 + 2), no lots -> headroom = 688 - 712 - 0 = -24 < 0
  -> INSUFFICIENT_CAPITAL (net_debit 710.00) at each attempt; one INSUFFICIENT_CAPITAL warning (the
  order's first refusal); the F3 nonfill cancels: EXIT_UNFILLED. The position is kept.
2024-03-15 CUT: SPX_PM 4897.00 (pin): P4900 pays 100*(4900 - 4897) = 300, P4895 0; net_cash -300,
  fees 0 -> PAYABLE[2024-03-18] 300; headroom = 688 - 300 - 0 = 388 >= 0 (the width reserve covered it).
Account 2024-03-15: cash 688; receivable 0; payable 300; encumbrance 0; headroom 388; mid_nlv 388.
2024-03-18 (final; Monday): OPEN cash = 688 - 300 = 388; ENTRY_SKIPPED (FINAL_SESSION).
  Account: cash 388, headroom 388, mid_nlv 388; final_equity_usd = 388.
Campaign c1: realized_pnl = -(+100 + 110) = -210 (as G02); fees 2; net -212 = 388 - 600.
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL, INSUFFICIENT_CAPITAL (F1), EXIT_UNFILLED (F3).
"""

