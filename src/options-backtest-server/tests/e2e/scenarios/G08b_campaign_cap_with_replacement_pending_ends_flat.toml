derivation = """
Conventions as G01. Roll: sequential, trigger_dte 8, max_rolls 1, max_campaign_sessions 5;
take_profit and stop_loss null. A = SPXW:2024-03-15:P:{4900,4895}.

2024-03-04: ENTRY as G08a (D -90, fees 2); campaign session 1 = 2024-03-04. 2024-03-05 cash 10088.
2024-03-07 DEC: campaign session 4 (03-04, 05, 06, 07) < 5, so CAMPAIGN_CAP is false;
  RollTrigger (dte 8 <= 8), rolls 0 < 1 -> ROLL_CLOSE; close D = 140 - 40 = 100; limit 100.
  Fill F1: D 100, fees 2; c1.g1 P&L = -(-60 + 70) - 4 = -14.
Account 2024-03-07: cash 10088; receivable 0; payable 102; encumbrance 0; headroom 9986.
2024-03-08 OPEN: cash = 10088 - 102 = 9986. DEC: roll_open_due, not the final session, campaign
  session 5 >= max_campaign_sessions 5 -> END_CAMPAIGN (CAMPAIGN_CAP): no selection, no order,
  flat (design §10.4: a pending replacement is not submitted once the cap is reached).
Account 2024-03-08: cash 9986; receivable 0; payable 0; encumbrance 0; headroom 9986; mid_nlv 9986.
2024-03-11 (final; Monday, scheduled): flat -> ENTRY_SKIPPED (FINAL_SESSION), no warning.
  Account cash 9986, mid_nlv 9986; final_equity_usd = 9986 = 10000 - 14.
Campaign c1: one generation, closed by its roll close and not reopened -> outcome closed,
  exit_trigger roll_not_reopened, end_session = 2024-03-07 (its last position's close);
  realized_pnl = -(-60 + 70) = -10; fees 4; rolls 0; basis 90.
Fills: exactly the entry and the roll close (no roll open).
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL only.
"""

