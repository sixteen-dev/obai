derivation = """
Conventions as G01: m = 100, $1.00 per contract side, $0 settlement fee, T+1, zero interest,
S = 5000.00, DF = 1. P4900 = SPXW:2024-03-15:P:4900, P4895 = SPXW:2024-03-15:P:4895.

2024-03-04: entry exactly as G01: D = 100*(-2.00) + 100*1.10 = -90, fees 2, limit -90, basis 90.
Account 2024-03-04: cash 10000; receivable 90; payable 2; encumbrance 500 + 2 = 502;
  headroom = 10000 - 2 - 502 = 9496.
2024-03-05 OPEN: cash = 10000 + 90 - 2 = 10088. Account 2024-03-05: cash 10088, receivable 0,
  payable 0, encumbrance 502, headroom = 10088 - 502 = 9586.
2024-03-05 .. 2024-03-14: no trigger (take_profit and stop_loss null; dte 10..1 > exit_dte 0;
  held sessions 2..9 < 252): hold. 2024-03-11 is a Monday but a position is held: no entry.
2024-03-15 DEC (expiry, not final): dte 0 <= 0 -> TIME_EXIT; the P4895 closing sell needs
  VALID/LOCKED, its DEC quote is NO_BID -> no quote_ok -> EXIT_DEFERRED (warning), no order.
  No CLOSE mark: the legs expire this session.
2024-03-15 CUT: SPX_PM final value 4897.00 (pin), observation s:SPX_PM:2024-03-15:c0;
  P4900 (q -1): intrinsic 100*(4900 - 4897) = 300 -> -300; P4895 (q +1): max(4895 - 4897, 0) = 0;
  net_cash = -300 + 0 = -300 -> PAYABLE[2024-03-18]; settlement fees 2 contracts * $0 = 0.
  The entry carries input_refs (s:SPX_PM:2024-03-15:c0) and retires both contracts.
Account 2024-03-15: cash 10088; receivable 0; payable 300; encumbrance 0;
  headroom = 10088 - 300 = 9788; mid_nlv = natural_nlv = 10088 - 300 = 9788 (flat).
2024-03-18 (final; Monday, scheduled): OPEN cash = 10088 - 300 = 9788; flat -> ENTRY_SKIPPED
  (FINAL_SESSION), no warning. Account 2024-03-18: cash 9788, payable 0, headroom 9788,
  mid_nlv 9788. final_equity_usd = 9788 (F04); one entry.
Campaign c1: REALIZED_PNL[P4900] = -200 + 300 = +100, REALIZED_PNL[P4895] = +110 (cost lost);
  realized_pnl = -(100 + 110) = -210; fees = 2 + 0 = 2; net = -212 = 9788 - 10000.
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL, then EXIT_DEFERRED (2024-03-15).
"""

