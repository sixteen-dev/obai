final_equity_usd = "10052.00"
warning_codes = ["SYNTHETIC_FIXTURE_NOT_HISTORICAL"]
open_positions = []
derivation = """
Conventions as G01. Roll: sequential, trigger_dte 8, max_rolls 1, max_campaign_sessions 20;
take_profit 0.5 x initial_credit; stop_loss null.
A = SPXW:2024-03-15:P:{4900,4895}, B = SPXW:2024-03-21:P:{4900,4895}.
Take-profit threshold = 0.5 * basis; basis = 90 (the campaign's entry) -> 45.

c1.g1 2024-03-04: ENTRY on A: D -90, fees 2, basis 90, entry_debit_incl_fees -88. Fill F1.
2024-03-05 and 2024-03-06 DEC: close D = 120 - 40 = 80; pnl = 0 + 88 - 80 - 2 = 6 < 45;
  dte 10, 9 > 8: hold. (2024-03-05 OPEN cash = 10088.)
2024-03-07 DEC: close D = 100*1.40 - 100*0.40 = 100; pnl = 88 - 100 - 2 = -14 < 45 (no exit);
  RollTrigger dte 8 <= 8, rolls 0 < 1 -> ROLL_CLOSE, limit 100. Fill F1: D 100, fees 2.
  realized_prior = generation P&L(c1.g1) = -(-(200 - 140) + (110 - 40)) - (2 + 2) = -10 - 4 = -14.
Account 2024-03-07: cash 10088; payable 102; encumbrance 0; headroom 9986.
2024-03-08 OPEN: cash 9986. DEC: ROLL_OPEN on B (dte 13, as G08a): D(1) = -240 + 120 = -120,
  fees 2, limit -120. Fill F1 -> c1.g2; rolls 1; basis stays 90; realized_prior stays -14;
  entry_debit_incl_fees(c1.g2) = -120 + 2 = -118.
Account 2024-03-08: cash 9986; receivable 120; payable 2; encumbrance 502; headroom 9482.
2024-03-11 OPEN: cash = 9986 + 120 - 2 = 10104. DEC: close D = 100*1.00 - 100*0.40 = 60;
  pnl = -14 + 118 - 60 - 2 = 42 < 45 -> hold (dte 10 > 8).
  [An unlinked P&L, 118 - 60 - 2 = 56 >= 45, would exit here.]
Account 2024-03-11: cash 10104; receivable 0; payable 0; encumbrance 502; headroom 9602.
2024-03-12 DEC: close D = 100*0.90 - 100*0.40 = 50; pnl = -14 + 118 - 50 - 2 = 52 >= 45 -> EXIT
  (TAKE_PROFIT; dte 9 > 8, so no roll trigger); limit 50. Fill F1: D 50, fees 2.
  [The replacement's own basis 120 gives 0.5*120 = 60 > 52, and would hold here.]
Account 2024-03-12: cash 10104; payable 52; encumbrance 0; headroom 10052; mid_nlv 10052.
2024-03-13 (final; Wednesday, flat): OPEN cash = 10104 - 52 = 10052; final_equity_usd = 10052.
Campaign c1: g1 REALIZED_PNL +10, g2 -(240 - 90) + (120 - 40) = -70; realized_pnl = -(10 - 70) = 60;
  fees 8; net 52, which is the exit decision's pnl 52 because the fill is at the DEC naturals.
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL only.
"""

