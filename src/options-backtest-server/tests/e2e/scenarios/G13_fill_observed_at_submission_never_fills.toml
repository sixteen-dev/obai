proves = ["C05"]
derived_by = "C2"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-06" }
strategy = { file = "spxw_put_credit_vertical.json", patch = { roll = { mode = "sequential", trigger_dte = 1, max_rolls = 1, max_campaign_sessions = 2 } } }

