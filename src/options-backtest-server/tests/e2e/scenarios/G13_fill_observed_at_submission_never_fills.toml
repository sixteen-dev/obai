# G13: an F1 observation observed at the submission instant never fills (C05). Both legs' F1
# quotes are observed at DEC, so check 1 finds no observation strictly after submission; the
# fresh F2 quotes fill the whole package. The exit, at the campaign cap, is incidental to the
# claim: it is the suite's one held exit forced by max_campaign_sessions
# (R1Campaign.CanaryCampaignCapExit).
