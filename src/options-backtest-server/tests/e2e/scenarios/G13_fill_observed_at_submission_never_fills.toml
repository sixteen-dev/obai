  risk: -(-500 + (90 - 2)) + 2*1*max(1.00, 0) = 412 + 2 = 414 <= 0.10 * 10000 = 1000.
  preview headroom = 10000 - 2 - (500 + 2) = 9496 >= 0; capacity floor(min(50, 50)*0.10) = 5.
  ENTRY submitted at DEC, limit = -90 + 0.00 = -90.
2024-03-04 F1: each leg's latest visible observation of the session is its F1 one (observed
  DEC, available F1; it ranks above the DEC one on available_at). observed_at = DEC is not
  strictly after the submission instant DEC, so view.quote(observed_after_ns=DEC) is None:
  NO_OBSERVATION on P4900, the first leg in leg order (every leg passes check 1 before check 2);
  no net_debit is computed. The order stays live.
2024-03-04 F2: pinned F2 quotes, observed 15:47 > DEC, age 0: both VALID, sides > 0;
  D = -90 <= -90; Q*D = 90 > 0; capacity 5 >= 1; post-fill headroom 9496 >= 0 -> fill:
  net_debit -90.00, fees 2.00; basis |-90| = 90; campaign c1 starts (campaign session 1).
Account 2024-03-04 (CUT): cash 10000; receivable 90; payable 2; encumbrance 500 + 2 = 502;
  headroom = 10000 - 2 - 502 = 9496.
2024-03-05 OPEN: dues through 2024-03-05 settle: cash = 10000 + 90 - 2 = 10088.
2024-03-05 DEC: held; dte 10 > exit_dte 0 and held session 2 < 252 (no TIME_EXIT); no
