  RollTrigger false (dte 10 > 1). Closing legs (P4900 +1, P4895 -1) usable at DEC ->
  EXIT (CAMPAIGN_CAP); close D = 100*1.20 - 100*0.40 = 80; limit 80 + 0.00 = 80.
2024-03-05 F1: D = 80 <= 80; capacity 5 >= 1; post-fill headroom = 10088 - (80 + 2) - 0 = 10006
  -> fill: net_debit 80.00, fees 2.00; the campaign ends.
Account 2024-03-05: cash 10088; receivable 0; payable 82; encumbrance 0; headroom 10006;
  mid_nlv = natural_nlv = 10088 - 82 = 10006 (flat).
2024-03-06 (final; Wednesday, unscheduled, flat, no replacement due): no decision event.
  OPEN cash = 10088 - 82 = 10006. final_equity_usd = mid_nlv(2024-03-06) = 10006; valid and flat.
Campaign c1: REALIZED_PNL[P4900] = -(200 - 120) = -80, [P4895] = +(110 - 40) = +70;
