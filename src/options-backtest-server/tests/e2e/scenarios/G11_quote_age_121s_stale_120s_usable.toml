Conventions as G01; max_holding_sessions 2; take_profit and stop_loss null.
P4900 = SPXW:2024-03-15:P:4900, P4895 = SPXW:2024-03-15:P:4895. QUOTE_MAX_AGE = 120 s, inclusive.

2024-03-04: entry as G01: D -90, fees 2. 2024-03-05 OPEN cash = 10088.
2024-03-05 DEC: TIME_EXIT (held session 2 >= 2). P4900's latest visible quote of the session is its
