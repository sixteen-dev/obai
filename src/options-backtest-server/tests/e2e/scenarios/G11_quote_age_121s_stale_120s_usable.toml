  EXIT_DEFERRED (warning); no order.
Account 2024-03-05: cash 10088; receivable 0; payable 0; encumbrance 502; headroom 9586.
2024-03-06 DEC: TIME_EXIT (held 3). P4900 DEC observed DEC - 120 s: age 120 s <= 120 s -> usable
  (VALID 1.00/1.20); P4895 0.40/0.50 -> EXIT; close D = 100*1.20 - 100*0.40 = 80; limit 80.
2024-03-06 F1: fresh F1 quotes observed after DEC: D = 80 <= 80, capacity 5 >= 1, post-fill
