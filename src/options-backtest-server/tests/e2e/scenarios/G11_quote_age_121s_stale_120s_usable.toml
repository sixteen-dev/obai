# G11: the quote-age bound is inclusive. A decision quote observed 121 s before DEC is stale and
# defers the exit. The next session's quote, observed exactly 120 s before DEC, is usable.
id = "G11"
proves = ["C08"]
derived_by = "C1"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-07" }
strategy = { file = "spxw_put_credit_vertical.json", patch = { exits = { max_holding_sessions = 2 } } }

[market]
# defaults.toml unchanged. QuoteStale moves observed_at back and keeps available_at (= DEC).

