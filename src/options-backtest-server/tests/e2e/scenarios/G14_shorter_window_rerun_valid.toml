# G14 (shorter window): the same strategy and market as G14_held_close_mark_missing_invalid.toml,
# requested separately over 2024-03-04 .. 2024-03-05 (C35). Its final session liquidates the
# position before the missing mark, so this run is valid; it does not repair the full-window run.
id = "G14"
proves = ["C35"]
derived_by = "C2"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-05" }
strategy = { file = "spxw_put_credit_vertical.json" }

[market]
# defaults.toml unchanged. The market is identical in both G14 files.

