# G12: all-or-none packages. A two-package entry does not fill at F1, where one leg has no
# fresh quote (no partial naked leg). It does not fill at F2, where the displayed size allows
# only one package (n = 2). It fills whole at F3. (CapacityBook reuse is a unit test.)
id = "G12"
proves = ["C09"]
derived_by = "C1"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-06" }
strategy = { file = "spxw_put_credit_vertical.json", patch = { sizing = { contracts = 2 }, exits = { take_profit = { basis = "initial_credit", fraction = 0.05 } } } }

[market]
# defaults.toml unchanged.

[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4900"
session = "2024-03-04"
slots = ["DEC", "F1", "F3"]
bid = "2.00"
ask = "2.20"
bid_size = 50
ask_size = 50

# F2: the short put's bid (the side a sell uses) shows 10 contracts.
[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4900"
session = "2024-03-04"
slots = ["F2"]
bid = "2.00"
ask = "2.20"
bid_size = 10
ask_size = 50

[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4895"
session = "2024-03-04"
slots = ["DEC", "F2", "F3"]
bid = "1.00"
ask = "1.10"
bid_size = 50
ask_size = 50

# F1: the long put has no observation of its own; only the DEC one, which never fills (C05).
[[market.overrides]]
kind = "quote_drop"
contract = "SPXW:2024-03-15:P:4895"
session = "2024-03-04"
slots = ["F1"]

[[market.overrides]]
kind = "quote_pin"
contract = "SPXW:2024-03-15:P:4900"
