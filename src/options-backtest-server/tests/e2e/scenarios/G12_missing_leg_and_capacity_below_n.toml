[expected]
calculation_status = "valid"
headline_eligible = true
final_equity_usd = "10012.00"
warning_codes = ["SYNTHETIC_FIXTURE_NOT_HISTORICAL"]
open_positions = []
derivation = """
Conventions as G01; fixed_contracts n = 2; take_profit 0.05 x initial_credit.
P4900 = SPXW:2024-03-15:P:4900, P4895 = SPXW:2024-03-15:P:4895.

2024-03-04 DEC: selection as G01; sizing n = 2:
  D(2) = 100*(-2)*2.00 + 100*(+2)*1.10 = -400 + 220 = -180; fees(2) = 2 legs * 2 * 1.00 = 4;
  risk: payoff min = 2 * -500 = -1000; entry_cash = 180 - 4 = 176; -(-1000 + 176) + provision
  2 legs * 2 * max(1.00, 0) = 824 + 4 = 828 <= 0.10 * 10000 = 1000;
  preview headroom = 10000 - 4 - (1000 + 4) = 8992 >= 0;
  DEC capacity floor(min(50/1, 50/1) * 0.10) = 5 >= 2; limit = -180 + 0.00 = -180.
2024-03-04 F1: P4895's only visible quote of the session is its DEC observation, not observed
  strictly after the DEC submission -> NO_OBSERVATION on P4895; nothing of either leg fills.
2024-03-04 F2: both VALID with sides > 0; D = -180 <= -180; Q*D = 180 > 0;
  capacity = floor(min(10/1, 50/1) * 0.10) = floor(1.0) = 1 < 2 -> CAPACITY (all or none),
  net_debit -180.00.
2024-03-04 F3: sizes 50 -> capacity 5 >= 2; D = -180 <= -180; post-fill headroom 8992 -> fill:
  2 packages, legs (P4900 -2 @ 2.00, P4895 +2 @ 1.10), net_debit -180.00, fees 4.00.
Account 2024-03-04: cash 10000; receivable 180; payable 4; encumbrance = 2*500 + 4 = 1004;
  headroom = 10000 - 4 - 1004 = 8992.
2024-03-05 OPEN: cash = 10000 + 180 - 4 = 10176.
2024-03-05 DEC: basis = |-180| = 180 (whole order); entry_debit_incl_fees = -180 + 4 = -176;
  close D(2) = 100*2*1.20 - 100*2*0.40 = 240 - 80 = 160; exit fees 4;
  LiquidationPnL = 0 + 176 - 160 - 4 = 12 >= 0.05 * 180 = 9 -> EXIT (TAKE_PROFIT); limit 160.
2024-03-05 F1: capacity 5 >= 2; D = 160 <= 160 -> fill, fees 4.
Account 2024-03-05: cash 10176; payable 164; encumbrance 0; headroom 10012; mid_nlv 10012.
2024-03-06 (final; flat): OPEN cash = 10176 - 164 = 10012; final_equity_usd = 10012.
Campaign c1: REALIZED_PNL[P4900] = -(400 - 240) = -160, [P4895] = +(220 - 80) = +140;
  realized_pnl = 20; fees 8; net 12 = 10012 - 10000.
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL only (entry nonfills disclose no warning).
"""

