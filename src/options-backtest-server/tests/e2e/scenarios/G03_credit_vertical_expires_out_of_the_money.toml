proves = ["settlement_ref"]
derived_by = "C1"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-18" }
strategy = { file = "spxw_put_credit_vertical.json" }

[market]
# defaults.toml unchanged; take-profit and stop-loss null (see G02).

[[market.overrides]]
