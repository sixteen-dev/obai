open_positions = []
retired_contracts = ["SPXW:2024-03-15:P:4895", "SPXW:2024-03-15:P:4900"]
derivation = """
Conventions as G01. P4900 = SPXW:2024-03-15:P:4900, P4895 = SPXW:2024-03-15:P:4895.

2024-03-04: entry as G01: D = -200 + 110 = -90, fees 2. Account 2024-03-04: cash 10000,
  receivable 90, payable 2, encumbrance 502, headroom 9496.
2024-03-05 OPEN: cash = 10000 + 90 - 2 = 10088. Held to 2024-03-14 without a trigger (as G02).
2024-03-15 DEC: TIME_EXIT (dte 0 <= 0); P4895 DEC quote NO_BID, unusable for its closing sell
  -> EXIT_DEFERRED (warning), no order.
2024-03-15 CUT: SPX_PM 4950.00 (pin), s:SPX_PM:2024-03-15:c0; intrinsics
  P4900: max(4900 - 4950, 0) = 0, P4895: max(4895 - 4950, 0) = 0 -> net_cash = 0, no RECEIVABLE
  or PAYABLE; fees 2 * $0 = 0. The entry still carries input_refs (s:SPX_PM:2024-03-15:c0),
  relieves both costs and retires both contracts (ADR 0001 §11 settlement_ref amendment).
Account 2024-03-15: cash 10088; receivable 0; payable 0; encumbrance 0; headroom 10088;
  mid_nlv = natural_nlv = 10088 (flat, no dues).
2024-03-18 (final; Monday): nothing due, ENTRY_SKIPPED (FINAL_SESSION). Account: cash 10088,
  headroom 10088, mid_nlv 10088. final_equity_usd = 10088.
Campaign c1: REALIZED_PNL[P4900] = -200 (the short's 200 premium kept), REALIZED_PNL[P4895] = +110;
  realized_pnl = -(-200 + 110) = 90; fees 2; net 88 = 10088 - 10000.
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL, EXIT_DEFERRED (2024-03-15).
"""

