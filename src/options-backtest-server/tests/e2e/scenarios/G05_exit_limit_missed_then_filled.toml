final_equity_usd = "10006.00"
warning_codes = ["SYNTHETIC_FIXTURE_NOT_HISTORICAL", "EXIT_UNFILLED"]
open_positions = []
derivation = """
Conventions as G01. P4900 = SPXW:2024-03-15:P:4900, P4895 = SPXW:2024-03-15:P:4895.

2024-03-04: entry as G01: D = -90, fees 2, limit -90, basis 90, entry_debit_incl_fees -88.
Account 2024-03-04: cash 10000, receivable 90, payable 2, encumbrance 502, headroom 9496.
2024-03-05 OPEN: cash = 10000 + 90 - 2 = 10088.
2024-03-05 DEC: close D = 100*1.20 - 100*0.40 = 80; LiquidationPnL = 0 + 88 - 80 - 2 = 6 >= 0.05*90
  = 4.5 -> EXIT (TAKE_PROFIT); limit = 80 + 0.00 = 80.
2024-03-05 F1, F2, F3: D = 100*1.25 - 100*0.40 = 85 > 80 -> LIMIT at each attempt (checks 1-3 pass:
  fresh, observed after DEC, VALID, sides > 0; closing orders have no direction check);
  net_debit 85.00 is reported. The F3 nonfill cancels the order: ORDER_CANCELLED + EXIT_UNFILLED.
  The position is kept.
Account 2024-03-05: cash 10088; receivable 0; payable 0; encumbrance 502 (still held);
  headroom = 10088 - 502 = 9586.
2024-03-06 DEC: held 3 < 252, dte 9 > 0; close D = 80, LiquidationPnL = 6 >= 4.5 -> EXIT
  (TAKE_PROFIT); limit 80.
2024-03-06 F1: D = 80 <= 80 -> fill; fees 2; post-fill headroom = 10088 - 82 = 10006.
Account 2024-03-06: cash 10088; payable 82; encumbrance 0; headroom 10006; mid_nlv 10006.
2024-03-07 (final; Thursday, flat): OPEN cash = 10088 - 82 = 10006; final_equity_usd = 10006.
Campaign c1: realized_pnl = -(-80 + 70) = 10 (as G01); fees 4; net 6.
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL, EXIT_UNFILLED (2024-03-05 F3).
"""

