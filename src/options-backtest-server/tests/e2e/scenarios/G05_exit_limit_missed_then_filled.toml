# G05: a take-profit exit whose limit is missed at F1, F2 and F3. The order is cancelled and the
# exposure is kept; the next session re-decides and fills.
id = "G05"
proves = ["failed_exit"]
derived_by = "C1"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-07" }
strategy = { file = "spxw_put_credit_vertical.json", patch = { exits = { take_profit = { basis = "initial_credit", fraction = 0.05 } } } }

