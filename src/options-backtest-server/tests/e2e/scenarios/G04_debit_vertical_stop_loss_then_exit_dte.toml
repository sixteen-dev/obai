derivation = """
Conventions as G01 (m = 100, $1.00 per contract side, T+1, S = 5000.00, DF = 1).
Strategy: buy call at moneyness 1.02 +- 0.0005, sell call +5; target_dte 17 in [15, 19];
exit_dte 14; stop_loss 0.5 x initial_debit; take_profit null. Legs in leg order (long, short).

c1 entry 2024-03-04 DEC: expiry 2024-03-22 (dte 18, 18 > 14). long: |Decimal(5100.0/5000.0) -
  1.02| ~ 1.8e-17; 5095 and 5105 miss by ~0.001. short: 5100 + 5 = 5105.
  D(1) = 100*2.10 - 100*1.40 = 70; Q*D = (+1)*70 > 0 (debit); fees 2; limit 70.
  risk: payoff min = 0 (S <= 5100); entry_cash = -70 - 2 = -72; -(0 - 72) + 2 = 74 <= 1000.
  preview headroom = 10000 - (70 + 2) - (0 + 2) = 9926 >= 0; capacity floor(50*0.10) = 5 >= 1.
c1 fill 2024-03-04 F1: D = 70 <= 70; net_debit 70.00, fees 2.00; basis = |70| = 70.
Account 2024-03-04: cash 10000; receivable 0; payable 70 + 2 = 72; encumbrance = settlement 0
  (long debit vertical: payoff >= 0) + fee provision 2 = 2; headroom = 10000 - 72 - 2 = 9926.
2024-03-05 OPEN: cash = 10000 - 72 = 9928.
c1 2024-03-05 DEC: dte 17 > 14, held 2 < 252; close legs (5100C -1, 5105C +1):
  close D = 100*(-0.80) + 100*0.60 = -20; exit fees 2; entry_debit_incl_fees = 70 + 2 = 72;
  LiquidationPnL = 0 - 72 - (-20) - 2 = -54 <= -0.5 * 70 = -35 -> EXIT (STOP_LOSS); limit -20.
c1 fill 2024-03-05 F1: D = -20 <= -20; net_debit -20.00 (a credit), fees 2.00.
Account 2024-03-05: cash 9928; receivable 20; payable 2; encumbrance 0; headroom = 9928 - 2 = 9926;
  mid_nlv = 9928 + 20 - 2 = 9946.
2024-03-06 OPEN: cash = 9928 + 20 - 2 = 9946. 2024-03-06 .. 2024-03-08: flat, unscheduled.
c1: REALIZED_PNL[5100C] = 210 - 80 = +130, [5105C] = -(140 - 60) = -80; realized_pnl = -(130 - 80)
  = -50; fees 4; net -54.
c2 entry 2024-03-11 DEC: expiry 2024-03-26 (dte 15 in [15, 19], 15 > 14); same pins as c1:
  D = 70, fees 2, limit 70; risk 74 <= 0.10 * 9946 = 994.6; headroom 9946 - 72 - 2 = 9872 >= 0.
c2 fill 2024-03-11 F1: D = 70; fees 2; basis 70.
Account 2024-03-11: cash 9946; payable 72; encumbrance 2; headroom = 9946 - 72 - 2 = 9872.
2024-03-12 OPEN: cash = 9946 - 72 = 9874.
c2 2024-03-12 DEC: dte(2024-03-12, 2024-03-26) = 14 <= 14 -> TIME_EXIT, the first true trigger;
  close D = 100*(-1.90) + 100*1.40 = -50; LiquidationPnL = 0 - 72 + 50 - 2 = -24 > -35 (no stop);
  EXIT limit -50.
c2 fill 2024-03-12 F1: D = -50 <= -50; net_debit -50.00, fees 2.00.
Account 2024-03-12: cash 9874; receivable 50; payable 2; encumbrance 0; headroom 9872;
  mid_nlv = 9874 + 50 - 2 = 9922.
c2: REALIZED_PNL[5100C] = 210 - 190 = +20, [5105C] = 140 - 140 = 0; realized_pnl = -20; fees 4;
  net -24.
2024-03-13 (final; Wednesday, flat, unscheduled): OPEN cash = 9874 + 50 - 2 = 9922;
  final_equity_usd = 9922 = 10000 - 54 - 24.
Warnings: SYNTHETIC_FIXTURE_NOT_HISTORICAL only.
"""

