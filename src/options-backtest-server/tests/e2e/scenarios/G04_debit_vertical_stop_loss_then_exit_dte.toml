# G04: a debit call vertical. Campaign c1 exits by stop-loss, measured against the debit basis.
# Campaign c2 exits when dte reaches exit_dte, while its stop-loss does not hold.
id = "G04"
proves = ["debit_basis"]
derived_by = "C1"
checked_by = "Ccheck"
window = { start = "2024-03-04", end = "2024-03-13" }
strategy = { file = "spxw_call_debit_vertical.json", patch = { exits = { stop_loss = { basis = "initial_debit", multiple = 0.5 } } } }

[market]
# Expiries 2024-03-04 + 18 = 2024-03-22 (Fri) and + 22 = 2024-03-26 (Tue); both inside the table.
weekly_dtes = [18, 22]

# c1 entry, 2024-03-04: only 2024-03-22 is in [15, 19] (dte 18; 2024-03-26 has dte 22).
[[market.overrides]]
