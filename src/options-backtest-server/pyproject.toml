[project]
name = "options-backtest-server"
version = "0.1.0"
description = "Deterministic options strategy backtesting engine: strict strategy ingestion and an exact double-entry ledger"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2,<4",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.14.2",
    "structlog>=25.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/options_backtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["lean: opt-in LEAN differential (needs LEAN_ROOT and a .NET SDK)"]
addopts = '--cov=options_backtest --cov-branch --cov-fail-under=90 -m "not lean"'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit (security)
    "D",      # pydocstyle
    "PL",     # Pylint
]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any)
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D203",    # 1 blank line required before class docstring (conflicts with D211)
    "D213",    # Multi-line docstring summary should start at the second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D102", "D103", "ANN201", "PLR2004"]
"scripts/*" = ["S101", "D103", "T201", "INP001"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { pydantic-settings = "0 days", fastmcp = "0 days", mcp = "0 days", pygments = "0 days", cryptography = "0 days", pytest = "0 days", python-multipart = "0 days", authlib = "0 days", urllib3 = "0 days", starlette = "0 days", idna = "0 days" }
constraint-dependencies = ["pyjwt>=2.13.0", "joserfc>=1.6.8", "cryptography>=50.0.0", "mcp>=1.28.1", "python-multipart>=0.0.31", "authlib>=1.7.2", "urllib3>=2.7.0", "starlette>=1.3.1", "idna>=3.15"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.160",
    "jsonschema>=4.26.0",
    "mypy>=1.19.1",
    "ruff>=0.15.7",
    "quantlib>=1.43",
]
