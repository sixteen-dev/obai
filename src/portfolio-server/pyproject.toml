[project]
name = "portfolio-server"
version = "0.1.1"
description = "MCP server for portfolio analysis - allocation, risk metrics, and Monte Carlo simulation"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.4",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "structlog>=25.1.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "pandas-stubs>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit (security)
    "D",      # pydocstyle
    "PL",     # Pylint
]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any)
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D203",    # 1 blank line required before class docstring (conflicts with D211)
    "D213",    # Multi-line docstring summary should start at the second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D102", "D103", "ANN201", "PLR2004", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.19.1",
    "ruff>=0.14.13",
]

[tool.uv]
constraint-dependencies = ["pyjwt>=2.13.0", "joserfc>=1.6.8", "cryptography>=50.0.0", "python-multipart>=0.0.31", "authlib>=1.7.2", "urllib3>=2.7.0", "starlette>=1.3.1", "idna>=3.15"]
