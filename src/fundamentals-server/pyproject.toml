[project]
name = "fundamentals-server"
version = "0.1.0"
description = "MCP server for company fundamentals with AI-enhanced educational context"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.4",
    "httpx>=0.28.1",
    "qdrant-client>=1.13.0",
    "openai>=1.57.2",
    "structlog>=25.1.0",
    "pyyaml>=6.0.3",
    "cachetools>=6.2.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
]
ignore = [
    "ANN401",  # Allow typing.Any where necessary (structlog, async context managers)
]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["qdrant_client", "qdrant_client.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.13",
    "types-cachetools>=6.2.0.20251022",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.uv]
constraint-dependencies = ["authlib>=1.7.2", "urllib3>=2.7.0"]
