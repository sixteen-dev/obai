[project]
name = "market-data-server"
version = "0.1.0"
description = "MCP server for real-time and historical market data"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=5.3.0",
    "fastmcp>=2.12.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.6.1",
    "structlog>=25.1.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
]
ignore = [
    "ANN401",  # Allow typing.Any where necessary (structlog, async context managers)
]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_ignores = true
show_error_codes = true
no_warn_unreachable = true

[tool.uv]
exclude-newer = "14 days"
exclude-newer-package = { cryptography = "0 days", fastmcp = "0 days", pygments = "0 days" }
constraint-dependencies = ["cryptography>=46.0.7", "fastmcp>=3.2.0", "pygments>=2.20.0"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20250915",
]
