[project]
name = "crypto-server"
version = "1.5.0"
description = "MCP server for Coinbase spot crypto research, backtesting, and strategy artifacts"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0,<2.0.0",
    "fastmcp>=2.12.4",
    "httpx>=0.28.1",
    "numpy>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.1",
    "structlog>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.14.13",
    "mypy>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "ANN", "S", "D", "PL"]
ignore = [
    "ANN401",
    "D100",
    "D104",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D102", "D103", "ANN201", "PLR2004"]
"src/clients/coinbase_client.py" = ["PLR0913", "S311"]
"src/engine/backtester.py" = ["PLR0913"]
"src/quality/source_quality.py" = ["PLR0913"]
"src/server.py" = ["PLR0913"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { fastmcp = "0 days", pytest = "0 days", pygments = "0 days", cryptography = "0 days", python-multipart = "0 days", authlib = "0 days", urllib3 = "0 days", starlette = "0 days", idna = "0 days" }
constraint-dependencies = ["cryptography>=46.0.7", "python-multipart>=0.0.27", "authlib>=1.7.2", "urllib3>=2.7.0", "starlette>=1.0.1", "idna>=3.15"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
