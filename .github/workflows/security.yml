name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit (uv audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ">=0.11.1"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run uv audit
        # Step shows ORANGE if vulns found, but job still passes.
        # Known unfixable: onnx (GHSA-hqmj-h5c6-369m), pygments (GHSA-5239-wwwm-4pmq)
        # Remove continue-on-error once upstream patches land.
        continue-on-error: true
        run: uv audit

  gitleaks:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --verbose
