name: Docker Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sixteen-dev/obai

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.changed.outputs.servers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed servers since last tag
        id: changed
        run: |
          # Get the previous tag (second most recent)
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)

          if [ -z "$PREV_TAG" ]; then
            # First tag — build everything
            echo 'servers=["fundamentals-server","market-data-server","events-news-server","options-server","screening-server","portfolio-server","backtest-server","research-server"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ALL_SERVERS=("fundamentals-server" "market-data-server" "events-news-server" "options-server" "screening-server" "portfolio-server" "backtest-server" "research-server")
          CHANGED=()

          for server in "${ALL_SERVERS[@]}"; do
            if git diff --name-only "$PREV_TAG"..HEAD -- "src/$server/" | grep -q .; then
              CHANGED+=("\"$server\"")
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "servers=[]" >> "$GITHUB_OUTPUT"
          else
            echo "servers=[$(IFS=,; echo "${CHANGED[*]}")]" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.servers != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: ${{ fromJson(needs.detect-changes.outputs.servers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src/${{ matrix.server }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.server }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.server }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.server }}
          cache-to: type=gha,mode=max,scope=${{ matrix.server }}
