name: Docker Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sixteen-dev/obai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server:
          - fundamentals-server
          - market-data-server
          - events-news-server
          - options-server
          - screening-server
          - portfolio-server
          - backtest-server
          - research-server
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src/${{ matrix.server }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.server }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.server }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.server }}
          cache-to: type=gha,mode=max,scope=${{ matrix.server }}
