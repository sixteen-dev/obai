[project]
name = "autotrader"
version = "0.1.1"
description = "OpenClaw autonomous paper trading bot - scripts and shared libraries"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.43.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "S", "PL"]
ignore = ["S101", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.uv]
constraint-dependencies = ["urllib3>=2.7.0", "msgpack>=1.2.1"]
