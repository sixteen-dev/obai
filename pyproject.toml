# Development-only pyproject.toml for monorepo tooling
# Individual services have their own pyproject.toml files for packaging

[project]
name = "obai"
version = "0.9.2"
description = "Development environment for OBaI monorepo"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.13.0",
]

[dependency-groups]
# Combined dependencies for all services
all = [
    # MCP Server dependencies
    "asyncio-mqtt>=0.16.2",
    "fastmcp>=1.0.0",
    "openai>=1.98.0",
    "pydantic-settings>=2.10.1",
    "mcp>=1.12.3",
    "pydantic>=2.10.1",
]

dev = [
    # Include all runtime dependencies
    {include-group = "all"},

    # Code quality and formatting
    "black>=25.1.0",
    "mypy>=1.17.1",
    "pre-commit>=4.0.0",
    "ruff>=0.12.7",

    # Testing
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",

    # MCP evaluation tools (for .claude/skills/mcp-builder/scripts/)
    "anthropic>=0.40.0",

    # Security: GHSA-gc5v-m9x4-r6x2 (insecure temp file fix)
    "requests>=2.33.0",

    # Type stubs
    "types-aiofiles>=24.1.0",
    "types-requests>=2.32.0",

    # PDF processing dependencies for scripts/process_pdfs_to_vectors.py
    "pymupdf4llm>=0.0.27",
    "pdfplumber>=0.11.7",
    "pyspellchecker>=0.8.3",
    "langdetect>=1.0.9",
    "unstructured[pdf]>=0.18.15",
]

test = [
    {include-group = "all"},
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[tool.uv]
exclude-newer = "14 days"
# Security-pinned packages exempt from exclude-newer age gate
exclude-newer-package = { requests = "0 days", pypdf = "0 days" }
# Pin transitive deps to patched versions where fixes exist
constraint-dependencies = [
    "pypdf>=6.9.2",       # GHSA-87mj-5ggw-8qc3: infinite loop fix
    "requests>=2.33.0",   # GHSA-gc5v-m9x4-r6x2: insecure temp file fix
]

# Tool configurations for the entire monorepo
[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src/screening-server/tests",
    "src/options-server/tests",
    "src/fundamentals-server/tests",
    "src/market-data-server/tests",
    "src/events-news-server/tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
]

[tool.coverage.run]
source = ["src/"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/dev/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  __pycache__
  | \.git
  | \.pytest_cache
  | \.venv
  | \.mypy_cache
  | \.ruff_cache
  | build
  | dist
  | dev
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = [".claude/skills"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "EXE",    # flake8-executable
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "INT",    # flake8-gettext
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PD",     # pandas-vet
    "PGH",    # pygrep-hooks
    "PL",     # Pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "NPY",    # NumPy-specific rules
    "PERF",   # Perflint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",    # line too long, handled by black
    "S101",    # Use of assert detected
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "COM812",  # missing-trailing-comma (conflicts with formatter)
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with formatter)
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "ARG001",  # Unused function argument (common in async handlers)
    "ARG002",  # Unused method argument
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "ARG", "FBT"]
"scripts/**/*" = ["T201", "S602", "S603"]
"dev/**/*" = ["T201", "S602", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["obai"]
known-third-party = ["fastmcp", "openai", "pydantic"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true

# Ignore missing imports for external libraries
ignore_missing_imports = true


# Paths to check
files = ["src/"]
exclude = [
    "dev/",
    "build/",
    "dist/",
    ".claude/skills/",
]
