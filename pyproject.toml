# Development-only pyproject.toml for monorepo tooling
# Individual services have their own pyproject.toml files for packaging

[project]
name = "obai"
version = "1.4.1b1"
description = "Development environment for OBaI monorepo"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.13.0",
]

[dependency-groups]
# Combined dependencies for all services
all = [
    # MCP Server dependencies
    "asyncio-mqtt>=0.16.2",
    "fastmcp>=1.0.0",
    "openai>=1.98.0",
    "pydantic-settings>=2.10.1",
    "mcp>=1.12.3",
    "pydantic>=2.10.1",
    "structlog>=25.1.0",
    "tavily-python>=0.7.0",
    # Web UI dependencies
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
]

dev = [
    # Include all runtime dependencies
    {include-group = "all"},

    # Code quality and formatting
    "black>=25.1.0",
    "mypy>=1.17.1",
    "pre-commit>=4.0.0",
    "ruff>=0.12.7",

    # Testing
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",

    # MCP evaluation tools (for .claude/skills/mcp-builder/scripts/)
    "anthropic>=0.40.0",

    # Security: GHSA-gc5v-m9x4-r6x2 (insecure temp file fix)
    "requests>=2.33.0",

    # Type stubs
    "types-aiofiles>=24.1.0",
    "types-requests>=2.32.0",

    # PDF processing dependencies for scripts/process_pdfs_to_vectors.py
    "pymupdf4llm>=0.0.27",
    "pdfplumber>=0.11.7",
    "pyspellchecker>=0.8.3",
    "langdetect>=1.0.9",
]

test = [
    {include-group = "all"},
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[tool.uv]
exclude-newer = "7 days"
# Security-pinned packages exempt from exclude-newer age gate
exclude-newer-package = { requests = "0 days", onnx = "0 days", anthropic = "0 days", cryptography = "0 days", fastmcp = "0 days", pygments = "0 days", aiohttp = "0 days", pytest = "0 days", pillow = "0 days", python-multipart = "0 days", authlib = "0 days", urllib3 = "0 days" }
# Pin transitive deps to patched versions where fixes exist
constraint-dependencies = [
    "python-multipart>=0.0.27",  # GHSA-pp6c-gr5w-3c5g: unbounded part-header DoS
    "requests>=2.33.0",      # GHSA-gc5v-m9x4-r6x2: insecure temp file fix
    "onnx>=1.21.0",          # CVE-2026-34447, GHSA-q56x: symlink traversal + TOCTOU
    "anthropic>=0.87.0",     # CVE-2026-34450, CVE-2026-34452: memory tool sandbox escape
    "cryptography>=46.0.7",  # CVE-2026-34073 + GHSA-p423-j2cm-9vmq: buffer overflow fix
    "fastmcp>=3.2.0",        # GHSA-m8x7, GHSA-rww4, GHSA-vv7q: injection + SSRF
    "pygments>=2.20.0",      # CVE-2026-4539: ReDoS in GUID matching
    "aiohttp>=3.13.4",       # CVE-2026-34513 thru CVE-2026-34525: header injection, SSRF, DoS
    "litellm>=1.83.7",       # GHSA-r75f-5x8p-qvmc + GHSA-v4p8-mg3p-g94g + GHSA-xqmj-j6mv-4862: SQLi, auth-RCE, SSTI
    "authlib>=1.7.1",        # GHSA-jj8c-mmj3-mmgv (CSRF), GHSA-r95x-qfjj-fjj2 (OIDC open redirect)
    "urllib3>=2.7.0",        # GHSA-mf9v-mfxr-j63j + GHSA-qccp-gfcp-xxvc: decompression bomb + header forwarding
]

# Tool configurations for the entire monorepo
[tool.pytest.ini_options]
# Each service has its own pyproject.toml with its own "src" package
# layout, so root-level pytest cannot resolve service-internal imports
# (multiple services share the package name "src"). Root pytest collects
# only the smoke test in tests/ so CI / local `uv run pytest` exits 0;
# the real per-service suites are aggregated by scripts/run-all-tests.sh.
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Skip every other monorepo subtree at the root level so test collection
# never wanders into a service tree that can\'t be imported from here.
norecursedirs = ["src", "skills", "docs", "data", "reports", ".venv", ".claude", "artifacts", "scripts", "vector_bucket"]
addopts = ["--strict-markers", "--strict-config"]


[tool.coverage.run]
source = ["src/"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/dev/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  __pycache__
  | \.git
  | \.pytest_cache
  | \.venv
  | \.mypy_cache
  | \.ruff_cache
  | build
  | dist
  | dev
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = [".claude/skills"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "EXE",    # flake8-executable
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "INT",    # flake8-gettext
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PD",     # pandas-vet
    "PGH",    # pygrep-hooks
    "PL",     # Pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "NPY",    # NumPy-specific rules
    "PERF",   # Perflint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",    # line too long, handled by black
    "S101",    # Use of assert detected
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "COM812",  # missing-trailing-comma (conflicts with formatter)
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with formatter)
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "ARG001",  # Unused function argument (common in async handlers)
    "ARG002",  # Unused method argument
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "ARG", "FBT"]
"scripts/**/*" = ["T201", "S602", "S603"]
"dev/**/*" = ["T201", "S602", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["obai"]
known-third-party = ["fastmcp", "openai", "pydantic"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true

# Ignore missing imports for external libraries
ignore_missing_imports = true


# Paths to check
files = ["src/"]
exclude = [
    "dev/",
    "build/",
    "dist/",
    ".claude/skills/",
]
