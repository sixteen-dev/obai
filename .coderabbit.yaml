language: en-US
tone_instructions: "Direct and concise. Only flag bugs, security issues, data corruption, or architectural problems. No style nits or refactoring suggestions."

reviews:
  profile: assertive
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  request_changes_workflow: true
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false

  slop_detection:
    enabled: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

  path_instructions:
    - path: "**/*.py"
      instructions: |
        You are reviewing a financial trading platform with multi-agent AI,
        MCP servers, and Alpaca brokerage integration. Stakes are high —
        bugs here can cause real money loss or data corruption.

        FOCUS ON (flag these aggressively):
        - Security: secrets in code/logs, injection, auth bypass, SSRF, unsafe deserialization
        - Correctness: wrong logic, off-by-one, float precision for money, silent data loss
        - Edge cases: empty responses, None where not expected, API timeouts, partial failures
        - Concurrency: race conditions, shared mutable state, async pitfalls
        - Architecture: circular imports, wrong abstraction layer, leaky interfaces, tight coupling
        - Error handling: bare except, swallowed exceptions, missing error propagation
        - Breaking changes: public API signatures, config schema, protocol changes

        DO NOT COMMENT ON (these are handled by CI tooling):
        - Code style, formatting, naming (ruff enforces this)
        - Type hints, docstrings (mypy --strict enforces this)
        - Import ordering
        - "Could be cleaner" or "consider refactoring" suggestions
        - Adding comments or logging
        - Test coverage unless a critical money/security path is untested
        - Performance unless it's an actual bottleneck (not theoretical)

    - path: "src/servers/**/*.py"
      instructions: |
        MCP server code. Watch for:
        - Unvalidated external API responses (FMP, Alpaca, polygon)
        - API keys in logs or error messages
        - Missing rate limit handling
        - Unbounded data fetches without pagination limits

    - path: "src/OBaI/core_agents/**/*.py"
      instructions: |
        Agent orchestration layer. Watch for:
        - Session/state leaking between users
        - Prompt injection via user input flowing into agent prompts
        - Tool call results trusted without validation
        - Circular agent dependencies

  tools:
    ruff:
      enabled: false
    mypy:
      enabled: false
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true

chat:
  auto_reply: true
