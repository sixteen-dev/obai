# Opik self-hosted local development stack
# Source: https://github.com/comet-ml/opik (adapted for OBaI dev environment)
#
# First-time setup (once only):
#   ./setup-volumes.sh
#
# Usage:
#   docker compose -f infra/opik/docker-compose.yml up -d
#   UI: http://localhost:5173
#
# Data persistence:
#   Volumes are external — `docker compose down -v` will NOT delete them.
#   To actually nuke data: docker volume rm $(docker volume ls -q -f name=opik-)
#
# To use with dev MCP servers:
#   docker compose -f dev/docker-compose.yml -f infra/opik/docker-compose.yml up -d

services:
  # ---------------------------------------------------------------------------
  # Infrastructure: MySQL, Redis, ClickHouse, ZooKeeper, MinIO
  # ---------------------------------------------------------------------------

  opik-mysql:
    image: mysql:8.4.2
    container_name: opik-mysql
    hostname: opik-mysql
    environment:
      MYSQL_ROOT_PASSWORD: opik
      MYSQL_DATABASE: opik
      MYSQL_USER: opik
      MYSQL_PASSWORD: opik
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      timeout: 1s
      interval: 2s
      retries: 120
    volumes:
      - opik-mysql-data:/var/lib/mysql
    networks:
      - opik-network
    restart: unless-stopped

  opik-redis:
    image: redis:7.2.4-alpine3.19
    container_name: opik-redis
    hostname: opik-redis
    command: redis-server --requirepass opik
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6379"]
      interval: 2s
      timeout: 4s
      retries: 20
      start_period: 10s
    volumes:
      - opik-redis-data:/data
    networks:
      - opik-network
    restart: unless-stopped

  opik-zookeeper:
    image: zookeeper:3.9.4
    container_name: opik-zookeeper
    hostname: opik-zookeeper
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p /bitnami/zookeeper/data
        chown -R zookeeper:zookeeper /bitnami/zookeeper
        exec gosu zookeeper /docker-entrypoint.sh zkServer.sh start-foreground
    environment:
      JVMFLAGS: "-Xmx512m"
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,ruok"
      ZOO_DATA_DIR: /bitnami/zookeeper/data
      ZOO_DATA_LOG_DIR: /bitnami/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok"]
      interval: 2s
      timeout: 2s
      retries: 120
    volumes:
      - opik-zookeeper-data:/bitnami/zookeeper
    networks:
      - opik-network
    restart: unless-stopped

  opik-clickhouse-init:
    image: alpine:latest
    container_name: opik-clickhouse-init
    volumes:
      - ./clickhouse_config:/clickhouse_config_files
      - opik-clickhouse-config:/config
    command: |
      sh -c "
        cp -r /clickhouse_config_files/* /config/ &&
        chown -R 1000:1000 /config
      "
    networks:
      - opik-network

  opik-clickhouse:
    image: clickhouse/clickhouse-server:25.3.6.56-alpine
    container_name: opik-clickhouse
    hostname: opik-clickhouse
    environment:
      CLICKHOUSE_DB: opik
      CLICKHOUSE_USER: opik
      CLICKHOUSE_PASSWORD: opik
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - opik-clickhouse-data:/var/lib/clickhouse
      - opik-clickhouse-logs:/var/log/clickhouse-server
      - opik-clickhouse-config:/etc/clickhouse-server/config.d
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 120
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      opik-zookeeper:
        condition: service_healthy
      opik-clickhouse-init:
        condition: service_completed_successfully
    networks:
      - opik-network
    restart: unless-stopped

  opik-minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: opik-minio
    hostname: opik-minio
    environment:
      MINIO_ROOT_USER: THAAIOSFODNN7EXAMPLE
      MINIO_ROOT_PASSWORD: LESlrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    command: server --console-address ":9090" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    volumes:
      - opik-minio-data:/data
    networks:
      - opik-network
    restart: unless-stopped

  opik-minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: opik-minio-init
    depends_on:
      opik-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set s3 http://opik-minio:9000 THAAIOSFODNN7EXAMPLE LESlrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY --api S3v4 ;
      /usr/bin/mc mb --ignore-existing s3/public;
      /usr/bin/mc anonymous set download s3/public/;
      "
    networks:
      - opik-network

  # ---------------------------------------------------------------------------
  # Application: Backend, Python Backend, Frontend
  # ---------------------------------------------------------------------------

  opik-backend:
    image: ghcr.io/comet-ml/opik/opik-backend:latest
    container_name: opik-backend
    hostname: opik-backend
    command: ["bash", "-c", "./run_db_migrations.sh && ./entrypoint.sh"]
    environment:
      STATE_DB_PROTOCOL: "jdbc:mysql://"
      STATE_DB_URL: "opik-mysql:3306/opik?createDatabaseIfNotExist=true&rewriteBatchedStatements=true"
      STATE_DB_DATABASE_NAME: opik
      STATE_DB_USER: opik
      STATE_DB_PASS: opik
      ANALYTICS_DB_MIGRATIONS_URL: "jdbc:clickhouse://opik-clickhouse:8123"
      ANALYTICS_DB_MIGRATIONS_USER: opik
      ANALYTICS_DB_MIGRATIONS_PASS: opik
      ANALYTICS_DB_PROTOCOL: "HTTP"
      ANALYTICS_DB_HOST: "opik-clickhouse"
      ANALYTICS_DB_PORT: 8123
      ANALYTICS_DB_DATABASE_NAME: opik
      ANALYTICS_DB_USERNAME: opik
      ANALYTICS_DB_PASS: opik
      JAVA_OPTS: "-Dliquibase.propertySubstitutionEnabled=true -XX:+UseG1GC -XX:MaxRAMPercentage=80.0"
      REDIS_URL: redis://:opik@opik-redis:6379/
      OPIK_OTEL_SDK_ENABLED: "false"
      OPIK_USAGE_REPORT_ENABLED: "false"
      AWS_ACCESS_KEY_ID: THAAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: LESlrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      IS_MINIO: "true"
      S3_URL: http://opik-minio:9000
      PYTHON_EVALUATOR_URL: http://opik-python-backend:8000
      TOGGLE_GUARDRAILS_ENABLED: "false"
      TOGGLE_WELCOME_WIZARD_ENABLED: "false"
      CORS: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health-check"]
      interval: 5s
      timeout: 30s
      retries: 60
      start_period: 30s
    depends_on:
      opik-mysql:
        condition: service_healthy
      opik-clickhouse:
        condition: service_healthy
      opik-minio:
        condition: service_healthy
      opik-redis:
        condition: service_healthy
    networks:
      - opik-network
    restart: unless-stopped
    tmpfs:
      - /tmp

  opik-python-backend:
    image: ghcr.io/comet-ml/opik/opik-python-backend:latest
    container_name: opik-python-backend
    hostname: opik-python-backend
    privileged: true
    environment:
      OPIK_OTEL_SDK_ENABLED: "false"
      PYTHON_CODE_EXECUTOR_STRATEGY: process
      PYTHON_CODE_EXECUTOR_CONTAINERS_NUM: 5
      PYTHON_CODE_EXECUTOR_EXEC_TIMEOUT_IN_SECS: 3
      PYTHON_CODE_EXECUTOR_ALLOW_NETWORK: "false"
      PYTHON_CODE_EXECUTOR_CPU_SHARES: 512
      PYTHON_CODE_EXECUTOR_MEM_LIMIT: "256m"
      OPIK_REVERSE_PROXY_URL: http://opik-frontend:5173/api
      PYTHON_BACKEND_PORT: 8000
      REDIS_URL: redis://:opik@opik-redis:6379/0
      RQ_WORKER_ENABLED: "true"
      OPIK_URL_OVERRIDE: http://opik-backend:8080
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --quiet http://127.0.0.1:8000/healthcheck || exit 0"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 10s
    depends_on:
      opik-redis:
        condition: service_healthy
    networks:
      - opik-network
    restart: unless-stopped
    tmpfs:
      - /var/lib/docker

  opik-frontend:
    image: ghcr.io/comet-ml/opik/opik-frontend:latest
    container_name: opik-frontend
    hostname: opik-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./nginx_default_local.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      NGINX_PORT: 5173
      OTEL_TRACE: "off"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5173/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    depends_on:
      opik-backend:
        condition: service_healthy
    networks:
      - opik-network
    restart: unless-stopped

networks:
  opik-network:
    driver: bridge

volumes:
  opik-mysql-data:
    external: true
  opik-redis-data:
    external: true
  opik-zookeeper-data:
    external: true
  opik-clickhouse-data:
    external: true
  opik-clickhouse-logs:
    external: true
  opik-clickhouse-config:
    external: true
  opik-minio-data:
    external: true
