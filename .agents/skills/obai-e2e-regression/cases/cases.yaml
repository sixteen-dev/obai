# OBaI E2E Regression — advisor/quant case set v2
# DRAFT — replaces v1, which is preserved at cases.yaml.bak.
#
# Modeled on the workflow a real quant researcher or financial advisor follows
# before placing a trade:
#   1. Discovery       — what's interesting today?
#   2. Universe        — define a candidate set with constraints
#   3. Thesis          — research the name(s)
#   4. Risk            — portfolio context, concentration, drawdown
#   5. Strategy        — backtest the rule, validate with walk-forward
#   6. Execution       — entry levels, liquidity, hedges
#   7. Coordination    — multi-step queries that need several specialists in order
#   8. Prediction mkts — event-driven trades
#   9. Guardrail/bnd   — refusal, boundary, error handling
#
# OBaI skill coverage (every hub skill is exercised at least once):
#   - obai-grounding-and-cache       : D1, D3              (live numeric/freshness)
#   - obai-stock-synthesis           : T2-T4, K1-K4, C1    (multi-specialist synthesis)
#   - obai-research-routing          : T1                  (deep dive)
#                                        banned on: B1, S1, S2
#   - obai-prediction-market-routing : P1, P2, G2
#   - obai-strategy-routing          : S1-S5
#
# Field reference (preserved from v1):
#   id, feature              — used in report
#   query                    — verbatim user query
#   expected_tools           — specialist tool spans that MUST appear
#   expected_sequence        — partial order constraint when set
#   expected_skills          — load_skill spans that MUST appear
#   expected_skills_absent   — load_skill spans that MUST NOT appear
#   allowed_extras           — additional specialists tolerated without flagging
#   expect_rejection         — guardrail must reject (CLI exit 1)
#   expect_options_shape     — options math sanity (e.g. iron_condor, protective_put)
#   expect_async_job         — strategy returns a job stub; runner drives a follow-up turn
#   disabled                 — true skips the case (with disabled_reason)
#   smoke                    — included in smoke-only runs

test_cases:
  # ── 1. Discovery: what's the market doing today? ──
  - id: D1
    feature: sector_rotation
    query: "Which S&P 500 sectors are leading and lagging over the past month? Show 1M and 3M returns versus SPY and call out any clear rotation."
    expected_tools: [market_data_analysis]
    expected_skills: [obai-grounding-and-cache]
    smoke: true
    description: Sector relative-performance scan.

  - id: D2
    feature: macro_calendar
    query: "What macro events — Fed decisions, CPI, NFP, GDP — are on the U.S. calendar over the next two weeks that could move equities?"
    expected_tools: [events_news_analysis]
    expected_skills_absent: [obai-strategy-routing]
    description: Macro event calendar.

  - id: D3
    feature: unusual_volume
    query: "Show me liquid U.S. large-caps trading on at least 2x their 20-day average volume today, with the percent change, sorted by relative volume."
    expected_tools: [market_data_analysis]
    expected_skills: [obai-grounding-and-cache]
    description: Volume-anomaly screen for live action.

  - id: D4
    feature: earnings_week_watch
    query: "Which mega-cap names are reporting earnings this coming week? Include the date, time of day, and consensus EPS/revenue estimates."
    expected_tools: [events_news_analysis]
    allowed_extras: [fundamentals_analysis]
    smoke: true
    description: Upcoming earnings agenda.

  # ── 2. Universe: candidate set construction ──
  - id: U1
    feature: quality_screen
    query: "Screen U.S. large-caps for high-quality compounders: ROE above 15%, debt-to-equity below 0.5, gross margin above 40%, and 5-year revenue CAGR above 8%."
    expected_tools: [screener_lookup]
    allowed_extras: [fundamentals_analysis]
    description: Multi-factor quality screen.

  - id: U2
    feature: momentum_screen
    query: "Find liquid mid-caps within 5% of their 52-week high that have outperformed SPY by at least 10% over the past 6 months."
    expected_tools: [screener_lookup]
    allowed_extras: [market_data_analysis]
    description: Momentum + relative-strength screen.

  - id: U3
    feature: dividend_growth
    query: "Screen for dividend growers: yield above 2.5%, payout ratio below 65%, and at least 10 consecutive years of dividend increases."
    expected_tools: [screener_lookup]
    allowed_extras: [fundamentals_analysis]
    description: Dividend-aristocrat-style screen.

  # ── 3. Thesis: single-name and cross-sectional research ──
  - id: T1
    feature: investment_case
    query: "Build the investment case for Microsoft. Cover the moat, top 2-3 growth drivers, the strongest bear arguments, and where current valuation sits versus its own history."
    expected_tools: [research_analysis]
    expected_skills: [obai-research-routing]
    allowed_extras: [screener_lookup, fundamentals_analysis, events_news_analysis, market_data_analysis]
    smoke: true
    description: Advisor-style investment thesis with full evidence stack.

  - id: T2
    feature: peer_comparison
    query: "Compare AMD, NVDA, and INTC on revenue growth, gross margin, forward P/E, and 1-year stock performance. Which one screens cheapest on a quality-adjusted basis?"
    expected_tools: [fundamentals_analysis, market_data_analysis]
    expected_skills: [obai-stock-synthesis]
    allowed_extras: [research_analysis, screener_lookup]
    description: Cross-sectional fundamental + price comparison.

  - id: T3
    feature: earnings_setup
    query: "TSLA reports next week. Walk me through the setup — recent estimate revisions, the last 4 quarters' beat/miss pattern, current price relative to its 50-day and 200-day SMA, and any pre-announcement news."
    expected_tools: [events_news_analysis, fundamentals_analysis, market_data_analysis]
    expected_skills: [obai-stock-synthesis]
    allowed_extras: [research_analysis]
    description: Pre-earnings situational read across three domains.

  - id: T4
    feature: catalyst_impact
    query: "Palantir just announced a multi-year DoD contract worth roughly $400M. How material is this versus current run-rate revenue, and does it shift the bull case?"
    expected_tools: [events_news_analysis, fundamentals_analysis]
    expected_skills: [obai-stock-synthesis]
    allowed_extras: [research_analysis, market_data_analysis]
    description: News-driven thesis update.

  # ── 4. Risk: portfolio context before placing the trade ──
  - id: K1
    feature: pre_trade_concentration
    query: "I currently hold 15% AAPL, 30% QQQ, 25% VTI, 30% cash. I'm thinking about adding another 5% AAPL. What does my real AAPL exposure look like before and after the trade?"
    expected_tools: [portfolio_analysis]
    expected_skills: [obai-stock-synthesis]
    smoke: true
    description: Pre-trade concentration through ETF look-through.

  - id: K2
    feature: sharpe_drawdown_vs_benchmark
    query: "Score my portfolio (50% VOO, 20% QQQ, 20% TLT, 10% GLD) on trailing 1-year and 3-year Sharpe and max drawdown. Compare to a 60/40 SPY/AGG benchmark."
    expected_tools: [portfolio_analysis]
    expected_skills: [obai-stock-synthesis]
    allowed_extras: [market_data_analysis]
    description: Risk metrics versus benchmark.

  - id: K3
    feature: correlation_diversification
    query: "I hold MSFT, GOOGL, META, and AMZN as separate positions. How correlated are they actually over the past 2 years, and how much real diversification am I getting?"
    expected_tools: [portfolio_analysis]
    expected_skills: [obai-stock-synthesis]
    allowed_extras: [market_data_analysis]
    description: Correlation matrix to detect false diversification.

  - id: K4
    feature: scenario_stress
    query: "Stress test my 60% SPY / 30% TLT / 10% GLD portfolio against (a) a 30% equity drawdown like 2008 and (b) a 100bp rate spike. What's the expected portfolio impact in each?"
    expected_tools: [portfolio_analysis]
    expected_skills: [obai-stock-synthesis]
    description: Scenario stress test.

  # ── 5. Strategy: backtest, validation, capital constraints ──
  - id: S1
    feature: factor_momentum
    query: "Backtest a long-only cross-sectional momentum strategy on the S&P 500: top decile by 12-month-minus-1-month return, monthly rebalance, equal weight, from 2010 through 2024."
    expected_tools: [strategy_analysis]
    expected_skills: [obai-strategy-routing]
    expected_skills_absent: [obai-research-routing]
    description: Cross-sectional factor strategy.

  - id: S2
    feature: trend_with_regime
    query: "Backtest an SPY trend strategy: long when SPY closes above its 200-day SMA AND VIX is below 20, otherwise flat. From 2010 to today."
    expected_tools: [strategy_analysis]
    expected_skills: [obai-strategy-routing]
    expected_skills_absent: [obai-research-routing]
    description: Trend with macro regime gate.

  - id: S3
    feature: intraday_mean_reversion
    query: "Backtest a 5-minute mean-reversion on QQQ — enter long when RSI(14) drops below 25 between 9:45 and 11:00 ET, exit on RSI crossing back above 50, flat by close, 1.5% stop. Last 18 months."
    expected_tools: [strategy_analysis]
    expected_skills: [obai-strategy-routing]
    smoke: true
    description: Intraday session-bounded mean-reversion with strict thresholds.

  - id: S4
    feature: walk_forward
    query: "I run a 5/20 EMA crossover on SPY. Walk-forward test it with 2-year train, 6-month test, rolling, from 2015 onward. Tell me if it's robust or overfit."
    expected_tools: [strategy_analysis]
    expected_skills: [obai-strategy-routing]
    expect_async_job: true
    smoke: true
    description: Walk-forward robustness validation (async; runner drives the follow-up turn).

  - id: S5
    feature: portfolio_capital_pool
    query: "Backtest an RSI(14) below 30 mean-reversion across XLK, XLF, XLE, XLV, XLY using a $200,000 shared capital pool, max 2 concurrent positions, daily bars, 2018 through 2024."
    expected_tools: [strategy_analysis]
    expected_skills: [obai-strategy-routing]
    description: Multi-symbol portfolio mode with shared capital.

  # ── 6. Execution: trade planning ──
  - id: X1
    feature: entry_levels
    query: "I want to start an NVDA position. Identify the key technical levels — recent swing low, 50-day and 200-day SMA, and clear support/resistance from the past 6 months."
    expected_tools: [market_data_analysis]
    description: Technical entry-level read.

  - id: X2
    feature: protective_put
    query: "I'm long 200 shares of AAPL at an average cost of $185. I want to hedge downside through year-end. What's a sensible protective put — strike, expiry, cost, and effective worst-case?"
    expected_tools: [options_analysis]
    expect_options_shape: protective_put
    disabled: true
    disabled_reason: "options data API not configured"
    description: Protective-put sizing for an existing long.

  - id: X3
    feature: liquidity_check
    query: "I want to buy $500,000 of PLTR in a single trading day. Given recent average daily volume, is that reasonable, and what slippage / market impact should I expect?"
    expected_tools: [market_data_analysis]
    allowed_extras: [screener_lookup]
    description: Liquidity / market-impact assessment for a notional trade.

  # ── 7. Coordination: multi-step flows that need ordering ──
  - id: C1
    feature: explain_the_move
    query: "TSLA is down 6% today. What drove the move?"
    expected_tools: [market_data_analysis, events_news_analysis]
    expected_sequence: [market_data_analysis, events_news_analysis]
    expected_skills: [obai-stock-synthesis]
    description: Confirm the move with price/volume, then look for catalysts.

  # ── 8. Prediction markets ──
  - id: P1
    feature: pm_market_explainer
    query: "Find the most liquid Polymarket market on the 2026 U.S. midterm Senate control. Explain how it resolves and what it's pricing right now."
    expected_tools: [prediction_market_analysis]
    expected_skills: [obai-prediction-market-routing]
    smoke: true
    description: Liquid PM market explainer with resolution criteria.

  - id: P2
    feature: pm_relative_value
    query: "Compare two Polymarket markets on Fed policy: '50bps cut by year-end' versus 'any cut by year-end'. Are the implied probabilities internally consistent, and which is the better expression of a dovish view?"
    expected_tools: [prediction_market_analysis]
    expected_skills: [obai-prediction-market-routing]
    description: PM relative-value sanity check.

  # ── 9. Guardrail / boundary / error ──
  - id: G1
    feature: off_topic_reject
    query: "Recommend a good Italian restaurant for dinner tonight."
    expect_rejection: true
    smoke: true
    description: Off-topic rejection.

  - id: G2
    feature: sports_pm_accept
    query: "Polymarket has markets on the next NBA Finals winner. What are the current odds and how liquid are they?"
    expected_tools: [prediction_market_analysis]
    expected_skills: [obai-prediction-market-routing]
    description: Sports accepted via PM route (not a guardrail bypass).

  - id: B1
    feature: news_only_no_research
    query: "Any breaking news on AAPL today?"
    expected_tools: [events_news_analysis]
    expected_skills_absent: [obai-research-routing]
    description: Boundary — news query must not pull in research routing.

  - id: ERR1
    feature: ticker_typo
    query: "What's the price of GOOGLE?"
    expected_tools: [market_data_analysis]
    allowed_extras: [screener_lookup]
    description: Common-name typo — should disambiguate to GOOGL/GOOG.
