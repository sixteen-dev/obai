# OBaI E2E Regression — prediction-market focused case set v6
# DRAFT — replaces v5 (which is preserved at cases.yaml.bak4).
# v4 is at cases.yaml.bak3. v2 is at cases.yaml.bak2. v1 is at cases.yaml.bak.
#
# Purpose: a tight regression set for prediction-market routing and historical
# analytics. One group:
#
#   P  — Prediction markets. Live market routing plus historical calibration,
#        longshot bias, rule backtests, Monte Carlo risk, Kelly sizing,
#        out-of-sample (train/holdout) validation, live-market edge vs
#        resolved base rates, and assumed-execution-cost backtests.
#
# History: v4 (cases.yaml.bak3) was a strategy_analysis + knowledge_base_lookup
# set (groups B/BK/K). knowledge_base_lookup was reverted out of the tree, so
# those groups were retired in v5 — this set is prediction-market only now.
# Restore B/BK/K from bak3 only if the knowledge-base server is reintroduced.
#
# Field reference:
#   id, feature              — used in report
#   query                    — verbatim user query
#   expected_tools           — specialist tool spans that MUST appear
#   expected_sequence        — partial order constraint when set
#   expected_skills          — load_skill spans that MUST appear
#   expected_skills_absent   — load_skill spans that MUST NOT appear
#   allowed_extras           — additional specialists tolerated without flagging
#   expect_async_job         — strategy returns a job stub; runner drives a follow-up turn
#   smoke                    — included in smoke-only runs
#   disabled                 — true skips the case (with disabled_reason)

test_cases:
  # ── P: Prediction markets — routing + historical analytics ──

  - id: P5
    feature: pm_backtest_rule_politics
    query: "Backtest this Polymarket rule for the 2026 cycle: buy YES on politics markets when YES was priced between 5¢ and 15¢, hold to resolution, only markets with at least $25K lifetime volume. I want sample size, win rate, return distribution, monte_carlo_input, and the lifetime-volume contamination warning. Use the structured rule backtester, not the legacy setup test."
    expected_tools: [prediction_market_analysis]
    expected_skills: [obai-prediction-market-routing]
    smoke: true
    description: backtest_prediction_rule on a structured YES longshot rule with min_lifetime_volume + volume_filter_mode=lifetime_static.

  - id: P6
    feature: pm_backtest_ttr_regression
    query: "Same 5¢-15¢ politics longshot Polymarket backtest, but only count entries where there were at least 30 days remaining to resolution at the entry timestamp. Tell me the surviving sample size and the per-entry skip reasons."
    expected_tools: [prediction_market_analysis]
    expected_skills: [obai-prediction-market-routing]
    description: "Regression for TTR-at-entry-time fix. Before the fix, min_days_to_resolution>0 would silently skip every closed market because end_date < now. The simulator now checks (end_date - entry_ts) and surfaces ttr_min_unmet skip counts."

  - id: P7
    feature: pm_monte_carlo_chained
    query: "Take the monte_carlo_input from that 5¢-15¢ politics longshot backtest and stress it. $25,000 bankroll, 5% position fraction, 30% max drawdown limit, 2,000 paths, seed 12345. Give me median terminal wealth, p5/p95 wealth, p95 and p99 max drawdown, drawdown-breach probability, and ruin probability. State the IID caveat."
    expected_tools: [prediction_market_analysis]
    expected_skills: [obai-prediction-market-routing]
    description: monte_carlo_prediction_risk consuming the upstream backtest's compact monte_carlo_input. Response must include the §13.2 IID limitation language and sampling_method=iid_bootstrap.

  - id: P8
    feature: pm_kelly_qualitative_refusal
    query: "How much should I size a Polymarket longshot trade given the kind of edge that 5-15¢ politics markets show historically? I'm not telling you my bankroll or my drawdown limit yet — what's the qualitative read?"
    expected_tools: [prediction_market_analysis]
    expected_skills: [obai-prediction-market-routing]
    description: "Sizing without bankroll/drawdown — estimate_empirical_kelly must return qualitative guidance only per §13.3. Agent must NOT invent numerical fractions."

  - id: P9
    feature: pm_kelly_numerical
    query: "Now size that 5¢-15¢ politics longshot Polymarket strategy properly. Bankroll $25,000, max drawdown 20%, confidence haircut 0.5. Give me naive Kelly, half Kelly, capped Kelly, the drawdown-constrained fraction, and the conservative recommendation. Mention the IID caveat."
    expected_tools: [prediction_market_analysis]
    expected_skills: [obai-prediction-market-routing]
    description: estimate_empirical_kelly with full risk constraints — numerical fractions, kelly_method, IID caveat. Conservative fraction must be min(haircut * half_kelly, drawdown_constrained).

  - id: P10
    feature: pm_backtest_out_of_sample
    query: "I'm worried that 5¢-15¢ politics longshot Polymarket rule is just overfit to the past. Run the backtest but split the markets in two by date — fit on the older ones, then test on the newer ones I didn't fit on — and tell me whether the edge actually holds up out of sample. Give me the win rate on each half and the difference, and if the test half has barely any markets, tell me it's too small to trust instead of pretending it held."
    expected_tools: [prediction_market_analysis]
    expected_skills: [obai-prediction-market-routing]
    description: "backtest_prediction_rule with holdout_fraction/holdout_split_at (§11.5). Response must add the out_of_sample block (train, holdout, signed delta on win_rate/avg_return_on_cost) and flag out_of_sample.low_n when the holdout is thin. Phrased as a retail trader worried about overfitting, not naming the parameter."

  - id: P11
    feature: pm_estimate_market_edge
    query: "Find me a live Polymarket politics longshot trading somewhere around 25-35¢ and tell me whether it's actually cheap. Compare its price to how markets at that kind of price and time-left have really resolved in the past — I want the historical base rate, the edge in cents versus what it's trading at now, and a confidence interval on that base rate. If there aren't enough comparable resolved markets to say anything, just tell me it's too thin to call instead of guessing a number."
    expected_tools: [prediction_market_analysis]
    expected_skills: [obai-prediction-market-routing]
    smoke: true
    description: "estimate_market_edge (§10.7/§12.5) on a discovered live market — base_rate, signed edge (base_rate - price), Wilson base_rate_ci, calibration_universe. Discovery surfaces a real slug to satisfy grounding; must return edge=null with reason=low_n/no_bucket when the bucket is thin rather than quoting a number."

  - id: P12
    feature: pm_backtest_execution_cost
    query: "Run that 5¢-15¢ politics longshot Polymarket backtest again, but this time assume I'm not trading for free — bake in about a 1¢ cost getting in and another 1¢ getting out. Does the edge actually survive once I'm paying to trade? Show me the win rate and average return with the cost baked in, and be straight with me that this is an assumed round-trip cost I'm telling you to use, not real fills you measured."
    expected_tools: [prediction_market_analysis]
    expected_skills: [obai-prediction-market-routing]
    description: "backtest_prediction_rule with entry_cost/exit_cost (§11.6). Nonzero costs must echo assumed_execution_cost and append the assumed-cost limitation; entry filled at entry_price + entry_cost, intermediate exits at exit_price - exit_cost. Must frame it as an assumption, not reconstructed maker/taker fills."
