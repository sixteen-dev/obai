# OBaI E2E Regression release gate v2
#
# Cost policy:
#   - default_tier is the exact paid-API release gate.
#   - smoke is an explicit cheaper selection, not implicitly added to core.
#   - live is a separate provider/freshness canary and is not part of the
#     default paid run.
#   - every case protects a materially distinct routing, correctness, safety,
#     state-handoff, or freshness invariant.
#   - broader and intentionally redundant coverage lives in
#     src/obai/evaluation/test_cases/suite.yaml.
#
# Date policy:
#   - frozen: reproducible historical or synthetic inputs; never roll dates.
#   - relative: materialize calendar dates at the root turn and reuse them
#     throughout that same-session chain.
#   - live: current-provider canary with an explicit freshness requirement.
#
# Expected outcomes describe product behavior. Provider/auth/trace failures are
# infrastructure-inconclusive and must never satisfy a success expectation.
#
# estimated_api_calls is a minimum planning estimate for billable model requests,
# not a hard ceiling or a count of conceptual agent invocations. It includes
# each CLI turn's guardrail, hub routing/synthesis,
# mandatory skill loading when declared, and two requests per MCP specialist.
# It can understate an in-flight nested agent, whose SDK loop has a higher turn
# ceiling. max_cli_turns bounds CLI submissions; actual model requests are
# preserved from traces and checked before the next case.

schema_version: 2
suite_name: obai_e2e_release_gate
suite:
  default_tier: core
  timezone: America/New_York
  enforce_exact_tier_budgets: true
  tier_semantics:
    smoke: "Only cases whose tier is smoke."
    core: "Only cases whose tier is core; does not include smoke or live."
    live: "Only opt-in current-provider canaries whose tier is live."
  smoke_max_cases: 8
  smoke_max_api_calls: 45
  core_max_cases: 21
  core_max_api_calls: 157
  live_max_cases: 8
  live_max_api_calls: 48

test_cases:
  # -------------------------------------------------------------------------
  # Smoke: low-cost proof that every major route is alive.
  # -------------------------------------------------------------------------

  - id: SMK-MD
    feature: market_quote_freshness
    query: "Where is AAPL's latest available trade price now? Give the last price, provider as-of timestamp when available, server retrieval timestamp, and whether the observation is regular-session, delayed, pre-market, after-hours, or from a closed session. Distinguish provider time from retrieval time and do not invent bid/ask fields."
    expected_tools: [market_data_analysis]
    expected_skills: [obai-grounding-and-cache]
    expected_outcome: success
    date_policy: live
    timezone: America/New_York
    max_age_seconds: 900
    tier: smoke
    smoke: true
    estimated_api_calls: 6
    max_cli_turns: 1
    cost: {class: low, max_specialist_calls: 1}
    freshness: {max_age_seconds: 900, as_of_required: true}
    assertions:
      required_text:
        - {regex: "\\b(?:regular[- ]session|pre[- ]market|after[- ]hours|closed|delayed)\\b"}
        - {regex: "\\b(?:timestamp|retrieved|retrieval|updated|as[- ]of)\\b"}
      manual_assertions:
        - "Verify the last price, timestamp age, distinction between provider as-of and retrieval time, and session labeling against the captured market-data payload; no unavailable bid/ask may be fabricated."

  - id: SMK-FUND
    feature: fundamentals_ttm_basis
    query: "Give Apple's current P/E, price-to-sales, and EV/EBITDA from the valuation-metrics source. State whether each value is trailing-twelve-month or fiscal-period based, identify any degraded source endpoint, and preserve every unavailable field instead of estimating it."
    expected_tools: [fundamentals_analysis]
    expected_skills: [obai-grounding-and-cache]
    expected_outcome: success
    date_policy: live
    timezone: America/New_York
    max_age_seconds: 1800
    tier: smoke
    smoke: true
    estimated_api_calls: 6
    max_cli_turns: 1
    cost: {class: low, max_specialist_calls: 1}
    freshness: {max_age_seconds: 1800, as_of_required: true}
    assertions:
      required_text:
        - {regex: "\\b(?:TTM|trailing[- ]twelve[- ]months?|fiscal(?: period)?)\\b"}
        - {regex: "\\b(?:P/E|price[- ]to[- ]sales|P/S|EV/EBITDA)\\b"}
        - {regex: "\\b(?:as[- ]of|as of|timestamp|retrieved|retrieval|updated|20\\d{2}[-/]\\d{1,2}[-/]\\d{1,2})\\b"}
      manual_assertions:
        - "Trace every reported multiple to a fundamentals payload and verify unavailable fields were not fabricated."
        - "Verify each multiple carries an as-of/retrieval timestamp and its age against the payload is within the declared max_age_seconds; a stale previous-close multiple presented as current fails."

  - id: SMK-NEWS
    feature: news_24h_timestamp_filter
    query: "What material Nvidia news was published in the last 24 hours as of now in US Eastern time? Include publication timestamps and direct source links. Say plainly if no qualifying item exists; do not fill the answer with older stories."
    expected_tools: [events_news_analysis]
    allowed_extras: [screener_lookup]
    expected_outcome: success
    acceptable_outcomes: [data_unavailable]
    date_policy: relative
    timezone: America/New_York
    max_age_seconds: 86400
    tier: smoke
    smoke: true
    estimated_api_calls: 7
    max_cli_turns: 1
    cost: {class: low, max_specialist_calls: 2}
    freshness: {max_age_seconds: 86400, as_of_required: true}
    assertions:
      required_text:
        - {regex: "(?:https?://[^\\s)]+|\\b(?:no qualifying|none found|no material)\\b)"}
        - {regex: "(?:\\b(?:published|publication|timestamp|20\\d{2}[-/]\\d{1,2}[-/]\\d{1,2})\\b|\\b(?:no qualifying|none found|no material)\\b)"}
      manual_assertions:
        - "Verify every included article falls inside the materialized 24-hour window and every material claim matches its linked source."

  - id: SMK-SCREEN
    feature: screener_rank_and_completeness
    query: "Screen actively traded US technology stocks with market capitalization above $10 billion. Return the first five rows in the provider's actual order and state returned count, provider limit, has_more, requested_at, and that the result is provider-default rather than a ranking. Do not call this capped subset the top five by market cap."
    expected_tools: [screener_lookup]
    expected_outcome: success
    date_policy: live
    timezone: America/New_York
    max_age_seconds: 1800
    tier: smoke
    smoke: true
    estimated_api_calls: 5
    max_cli_turns: 1
    cost: {class: low, max_specialist_calls: 1}
    freshness: {max_age_seconds: 1800, as_of_required: true}
    assertions:
      required_text:
        - {regex: "\\bmarket cap(?:italization)?\\b"}
        - {regex: "\\b(?:returned|showing|results?|count)\\b"}
        - {regex: "\\b(?:has[_ -]?more|more results|complete|partial|limit)\\b"}
        - {regex: "\\b(?:provider[- ]default|not (?:a )?rank(?:ed|ing)|unsorted)\\b"}
      manual_assertions:
        - "Verify only supported filters were sent, row order is not misrepresented as ranked, and count/limit/has_more/requested_at match screener metadata."

  - id: SMK-PORT
    feature: portfolio_risk_cash_and_lookthrough
    query: "Analyze this $200,000 portfolio over the last two complete years through the last completed US session: VOO 40%, QQQ 25%, AAPL 15%, cash 20%. Report annualized volatility, Sharpe, Sortino, max drawdown, effective technology exposure after ETF look-through, data coverage, risk-free-rate source, and calculation conventions."
    expected_tools: [portfolio_analysis]
    allowed_extras: [market_data_analysis]
    expected_outcome: success
    date_policy: relative
    timezone: America/New_York
    max_age_seconds: 86400
    tier: smoke
    smoke: true
    estimated_api_calls: 7
    max_cli_turns: 1
    cost: {class: medium, max_specialist_calls: 2}
    assertions:
      required_text:
        - {regex: "\\bcash\\b"}
        - {regex: "\\b(?:risk[- ]free|Treasury)\\b"}
        - {regex: "\\b(?:coverage|observations?|trading days?|data window)\\b"}
      manual_assertions:
        - "Recompute volatility, Sharpe, Sortino, drawdown, and ETF look-through; verify weights sum to 100% and cash treatment is consistent."

  - id: SMK-OPT
    feature: options_dynamic_atm_liquidity
    query: "Using the latest AAPL underlying quote, select the standard monthly call expiration 30 to 60 calendar days away, then show the three listed strikes nearest spot. For each give the exact OCC symbol, bid, ask, volume, open interest, quote timestamp, underlying timestamp, and whether the chain was truncated. Do not substitute a fixed strike."
    expected_tools: [options_analysis]
    expected_outcome: success
    date_policy: live
    timezone: America/New_York
    max_age_seconds: 1800
    tier: smoke
    smoke: true
    estimated_api_calls: 5
    max_cli_turns: 1
    cost: {class: medium, max_specialist_calls: 1}
    freshness: {max_age_seconds: 1800, as_of_required: true}
    assertions:
      required_text:
        - {regex: "\\bAAPL\\d{6}C\\d{8}\\b"}
        - {regex: "\\b(?:timestamp|updated|retrieved|as[- ]of)\\b"}
        - {regex: "\\b(?:truncated|complete chain|pagination|page limit)\\b"}
      manual_assertions:
        - "Verify the selected expiration is 30-60 days away, strikes are nearest spot, liquidity fields come from the captured contracts, and no whole-chain statistic is inferred from a truncated page."

  - id: SMK-STRAT
    feature: backtest_reproducible_total_return
    query: "Using split- and dividend-adjusted daily data, backtest SPY long when SMA(50) is above SMA(200), otherwise zero-return cash, from 2015-01-02 through 2024-12-31. Use $100,000 initial capital, next-session-open execution, 5 bps slippage per side, 1 bp commission per side, and the fetched 3-month Treasury rate only for risk-adjusted metrics. Report trade count, total return, CAGR, Sharpe, Sortino, max drawdown, benchmark return, data source, and all assumptions."
    expected_tools: [strategy_analysis]
    expected_skills: [obai-strategy-routing]
    expected_outcome: success
    date_policy: frozen
    data_contract_id: spy-adjusted-daily-2015-2024-v1
    provider_revisions_allowed: true
    tier: smoke
    smoke: true
    estimated_api_calls: 6
    max_cli_turns: 1
    cost: {class: high, max_specialist_calls: 1}
    assertions:
      required_text:
        - {regex: "\\b(?:split|dividend)[- ]adjusted\\b"}
        - {regex: "\\bnext[- ]session[- ]open\\b"}
        - {regex: "\\b(?:slippage|commission|transaction costs?)\\b"}
        - {regex: "\\b(?:3[- ]month Treasury|risk[- ]free)\\b"}
      manual_assertions:
        - "Independently recompute return, CAGR, Sharpe, Sortino, drawdown, benchmark, capital reconciliation, and trade count from the frozen fixture."

  - id: SMK-GUARD
    feature: off_topic_guardrail
    query: "What's the weather like in Boston tomorrow?"
    expect_rejection: true
    expected_outcome: hub_reject
    date_policy: relative
    timezone: America/New_York
    max_age_seconds: 86400
    tier: smoke
    smoke: true
    estimated_api_calls: 3
    max_cli_turns: 1
    cost: {class: minimal, max_specialist_calls: 0}
    assertions:
      manual_assertions:
        - "Verify no financial specialist or provider tool was invoked."

  # -------------------------------------------------------------------------
  # Core: deterministic correctness, safety, degradation, and state handoff.
  # -------------------------------------------------------------------------

  - id: CORE-FX
    feature: foreign_filer_reporting_currency
    query: "Show Toyota Motor's latest completed annual income statement: revenue, operating income, and net income. Preserve the provider's reported currency and fiscal period, and do not label home-currency figures as US dollars."
    expected_tools: [fundamentals_analysis]
    allowed_extras: [screener_lookup]
    expected_outcome: success
    date_policy: relative
    timezone: America/New_York
    max_age_seconds: 86400
    tier: core
    estimated_api_calls: 7
    max_cli_turns: 1
    cost: {class: low, max_specialist_calls: 2}
    assertions:
      required_text:
        - {regex: "\\b(?:JPY|Japanese yen)\\b"}
        - {regex: "\\b(?:fiscal year|fiscal period|FY\\s?20\\d{2})\\b"}
      manual_assertions:
        - "Verify statement values and currency exactly match the fundamentals payload; no home-currency value may be silently labeled USD."

  - id: CORE-OPT-MIXED-EXPIRY
    feature: options_mixed_expiry_rejection
    query: "Synthetic position: long one AAPL call with strike $200 and 30 days remaining, and long one AAPL put with strike $200 and 60 days remaining. Try to produce one shared-expiry maximum-profit, maximum-loss and breakeven profile. Detect the mixed expirations and refuse that invalid aggregate instead of silently modeling both legs at one expiry."
    expected_tools: [options_analysis]
    expected_outcome: partial_refusal
    acceptable_outcomes: [specialist_error]
    date_policy: frozen
    oracle_id: options-mixed-expiry-validation-v1
    tier: core
    estimated_api_calls: 5
    max_cli_turns: 1
    cost: {class: low, max_specialist_calls: 1}
    assertions:
      required_text:
        - {regex: "\\b(?:mixed|different|multiple) expir(?:y|ies|ations?)\\b"}
        - {regex: "\\b(?:cannot|can't|unable|invalid|not valid|unsupported|refuse)\\b"}
      forbidden_text:
        - {regex: "(?i)\\b(?:max(?:imum)?[ -](?:profit|loss|gain)|breakeven)\\b[^.\\n]{0,30}[-+$]?\\d"}
      manual_assertions:
        - "Verify no aggregate shared-expiry payoff, maximum gain/loss, or breakeven was computed from the mixed-expiry legs."

  - id: CORE-OPT-MATH
    feature: options_dividend_iv_and_payoff_oracle
    query: "Use the options calculator's European Black-Scholes convention at runtime. Set expiry_date to the calendar date 60 days after today's US Eastern date. A call has spot $100, strike $100, continuously compounded risk-free rate 4%, continuous dividend yield 3%, volatility seed 30%, and market premium $5.50. Solve implied volatility from the premium, then return the calculator's price, delta, gamma, vega, theta and rho with units, the exact expiry_date, and enough precision to reproduce them. Do not claim a solver convergence flag the tool does not expose."
    expected_tools: [options_analysis]
    expected_outcome: success
    date_policy: relative
    timezone: America/New_York
    max_age_seconds: 86400
    oracle_id: black-scholes-dividend-synthetic-v1
    tier: core
    estimated_api_calls: 5
    max_cli_turns: 1
    cost: {class: low, max_specialist_calls: 1}
    assertions:
      required_text:
        - {regex: "\\bimplied volatility\\b"}
        - {regex: "\\bdividend yield\\b"}
        - {regex: "\\b(?:delta|gamma|vega|theta|rho)\\b"}
      manual_assertions:
        - "Using the exact trace time and submitted expiry_date, run the same wall-clock-to-4pm-ET convention and compare solved IV and every returned Greek within the tool's rounding; verify no invented convergence status."

  - id: CORE-PORT-COVERAGE
    feature: portfolio_unpriceable_weight
    query: "Analyze this portfolio over the last two complete years through the most recently completed US session: AAPL 25%, MSFT 25%, NVDA 25%, ZZZZ 25%. Report volatility, Sharpe, Sortino and max drawdown only if coverage is sufficient. ZZZZ is intentionally invalid: do not treat its 25% as zero-return cash, renormalize it away, or fabricate prices."
    expected_tools: [portfolio_analysis]
    expected_outcome: data_unavailable
    date_policy: relative
    timezone: America/New_York
    max_age_seconds: 86400
    degraded_outcome_patterns:
      data_unavailable: '(?i)\bZZZZ\b.{0,60}\b(?:unavailable|invalid|unpriceable|insufficient coverage|cannot compute|no data|not priced)\b|\b(?:unpriceable|insufficient coverage|cannot compute)\b'
    tier: core
    estimated_api_calls: 5
    max_cli_turns: 1
    cost: {class: medium, max_specialist_calls: 1}
    assertions:
      required_text:
        - {regex: "\\bZZZZ\\b"}
        - {regex: "\\b(?:25|75)\\s?(?:%|percent)"}
        - {regex: "(?i)\\b(?:unavailable|invalid|unpriceable|insufficient|cannot compute|no data|not priced|withheld)\\b"}
      forbidden_text:
        - {regex: "\\b(?:Sharpe|Sortino)\\b[^.\\n]{0,20}[-+]?\\d+\\.\\d"}
      manual_assertions:
        - "Verify the invalid 25% weight was neither treated as cash nor silently renormalized and that no portfolio metric was fabricated."

  - id: CORE-RESEARCH
    feature: research_verifiability_and_future_date_guard
    query: "Research analyst views published through today on Tesla's 2027 outlook. For every material claim provide a direct source URL and publication date. Treat any source dated after today's US Eastern date as suspicious future-dated evidence and exclude it from the conclusion."
    expected_tools: [research_analysis]
    expected_skills: [obai-research-routing]
    allowed_extras: [events_news_analysis, fundamentals_analysis]
    expected_outcome: success
    date_policy: relative
    timezone: America/New_York
    max_age_seconds: 86400
    tier: core
    estimated_api_calls: 10
    max_cli_turns: 1
    cost: {class: high, max_specialist_calls: 3}
    assertions:
      required_text:
        - {regex: "https?://[^\\s)]+"}
        - {regex: "\\b(?:20\\d{2}[-/]\\d{1,2}[-/]\\d{1,2}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\.?\\s+\\d{1,2},?\\s+20\\d{2})\\b"}
      manual_assertions:
        - "Verify each material claim is supported by its direct URL and no source dated after the materialized Eastern date influenced the conclusion."

  - id: CORE-WALKFORWARD
    feature: walk_forward_warmup_and_oos
    query: "Run a frozen walk-forward test of a long-only SPY SMA(200) trend rule from 2015-01-02 through 2024-12-31: five anchored training/test folds, at least 250 prior trading days of indicator warm-up for every test fold, next-open execution, 5 bps slippage and 1 bp commission per side. Report each fold's train and out-of-sample dates, warm-up coverage, trades, return, Sharpe and drawdown; then assess robustness without mixing train and test metrics."
    expected_tools: [strategy_analysis]
    expected_skills: [obai-strategy-routing]
    expect_async_job: true
    expected_outcome: success
    date_policy: frozen
    data_contract_id: spy-adjusted-daily-2015-2024-v1
    provider_revisions_allowed: true
    tier: core
    estimated_api_calls: 18
    max_cli_turns: 3
    cost: {class: high, max_specialist_calls: 1, max_async_polls: 2}
    async_contract:
      job_type: strategy_walk_forward
      max_wait_seconds: 600
      poll_prompt: "Check strategy walk-forward job {job_id} and echo that same value under the label 'Job ID:'. Begin with exactly one of: Status: queued, Status: running, Status: completed, or Status: failed. If completed, return all five stored fold results, warm-up coverage, out-of-sample metrics, operator list, and total trades without starting a new job."
    assertions:
      required_text:
        - {regex: "\\b(?:fold|window)\\s*[1-5]\\b"}
        - {regex: "\\b(?:warm[- ]?up|pre[- ]roll)\\b"}
        - {regex: "\\b(?:out[- ]of[- ]sample|OOS|test period)\\b"}
        - {regex: "\\b(?:slippage|commission|transaction costs?)\\b"}
      manual_assertions:
        - "Verify all five fold boundaries, at least 250 pre-start trading days per test fold, next-open execution, no look-ahead, and strictly separated train/OOS metrics."

  - id: CORE-INVALID
    feature: invalid_symbol_typed_error
    query: "What is FAKESYM trading at? Do not guess or silently substitute another ticker."
    expected_tools: [market_data_analysis]
    expected_outcome: data_unavailable
    date_policy: frozen
    data_contract_id: invalid-symbol-contract-v1
    provider_revisions_allowed: true
    degraded_outcome_patterns:
      data_unavailable: '(?i)\bFAKESYM\b.{0,40}\b(?:not found|invalid|no data|unavailable|no matching|unknown|does not exist)\b|\b(?:not found|invalid|no valid|no matching|unknown)\b.{0,40}\bFAKESYM\b'
    tier: core
    estimated_api_calls: 5
    max_cli_turns: 1
    cost: {class: low, max_specialist_calls: 1}
    assertions:
      required_text:
        - {regex: "\\bFAKESYM\\b"}
        - {regex: "\\b(?:not found|invalid|no data|unavailable|no matching)\\b"}
      forbidden_text:
        - {regex: "\\bFAKESYM\\b[^.\\n]{0,25}\\$\\s?\\d"}
      manual_assertions:
        - "Verify no quote was fabricated and no alternate ticker was silently substituted."

  - id: CORE-PREMISE
    feature: premise_check_before_causal_news
    query: "Did NVDA sell off during the most recently completed US trading session? Quantify its return versus SPY and the semiconductor group over the same timestamps. Only if it actually underperformed, identify timestamped catalysts published before or during the move; otherwise correct the premise. Distinguish evidence from inference."
    expected_tools: [market_data_analysis]
    allowed_extras: [events_news_analysis]
    expected_skills: [obai-stock-synthesis]
    expected_outcome: success
    date_policy: relative
    timezone: America/New_York
    max_age_seconds: 86400
    tier: core
    estimated_api_calls: 8
    max_cli_turns: 1
    cost: {class: medium, max_specialist_calls: 2}
    assertions:
      required_text:
        - {regex: "\\bNVDA\\b"}
        - {regex: "\\bSPY\\b"}
        - {regex: "\\b(?:same|common|matching) (?:session|window|timestamps?)\\b"}
        - {regex: "\\b(?:evidence|inference|correlation|causation)\\b"}
      manual_assertions:
        - "Verify the selloff premise from captured returns, benchmark and semiconductor comparisons use identical timestamps, and no causal catalyst claim exceeds timestamped evidence."

  - id: CORE-CRYPTO-BT
    feature: crypto_backtest_lifecycle_start
    query: "Run a frozen Coinbase BTC-USD daily spot trend backtest from 2025-01-01 through 2025-12-31: fast SMA 20, slow SMA 60, $100,000 initial capital, 60 bps taker fee, 5 bps spread, maximum position 25%, maximum bar participation 5%, and execution-venue-required data. Return the exact job_id, source-quality status, closed round-trip trade count and hit rate. Do not export an artifact yet."
    expected_tools: [crypto_analysis]
    expected_skills: [obai-crypto-routing]
    expect_async_job: true
    expected_outcome: success
    date_policy: frozen
    data_contract_id: coinbase-btc-usd-daily-2025-v1
    provider_revisions_allowed: true
    tier: core
    estimated_api_calls: 18
    max_cli_turns: 3
    cost: {class: high, max_specialist_calls: 1, max_async_polls: 2}
    async_contract:
      job_type: crypto_backtest
      max_wait_seconds: 600
      poll_prompt: "Check crypto backtest job {job_id} and echo that same value under the label 'Job ID:'. Begin with exactly one of: Status: queued, Status: running, Status: completed, or Status: failed. If completed, return the stored job_id, source-quality status, closed round-trip trade count, hit rate, fees, and realized P&L without starting or recomputing a backtest."
    assertions:
      required_text:
        - {regex: "\\bjob[_ -]?id\\b"}
        - {regex: "\\bsource[_ -]?quality\\b"}
        - {regex: "\\b(?:round[- ]trip|closed trades?)\\b"}
        - {regex: "\\b(?:hit rate|win rate)\\b"}
      forbidden_text:
        - {regex: "\\b(?:successfully|has been|was) exported\\b"}
      manual_assertions:
        - "Verify exact parameters, execution-grade eligibility, closed-round-trip denominator, hit-rate arithmetic, and that no artifact-export tool call occurred."

  - id: CORE-CRYPTO-INSPECT
    feature: crypto_backtest_lifecycle_inspect
    chain_from: CORE-CRYPTO-BT
    query: "Using the exact BTC-USD job_id from the previous turn, fetch stored job status and the first 20 trade-log rows. Preserve the job_id and execution configuration exactly. Reconcile closed round trips, hit rate, fees, realized P&L and maximum participation; do not recompute a new backtest."
    expected_tools: [crypto_analysis]
    expected_skills: [obai-crypto-routing]
    expected_outcome: success
    date_policy: frozen
    data_contract_id: coinbase-btc-usd-daily-2025-v1
    provider_revisions_allowed: true
    tier: core
    estimated_api_calls: 6
    max_cli_turns: 1
    cost: {class: medium, max_specialist_calls: 1}
    assertions:
      required_text:
        - {regex: "\\bjob[_ -]?id\\b"}
        - {regex: "\\b(?:trade log|stored trades?|fills?)\\b"}
        - {regex: "\\b(?:realized P&L|realized_pnl|fees?)\\b"}
      manual_assertions:
        - "Verify job_id and execution_config exactly equal the parent turn, results came from stored status/log tools, no new job was created, and fees/P&L/participation reconcile."

  - id: CORE-CRYPTO-EXPORT
    feature: crypto_backtest_lifecycle_export
    chain_from: CORE-CRYPTO-INSPECT
    query: "Only if that stored BTC-USD job is execution grade with no blocking quality warning, export one internal Coinbase paper-ledger artifact using the prior configuration plus stop_loss_pct 12. Return artifact_id and fingerprint. If eligibility is not established, fail closed and create no artifact."
    expected_tools: [crypto_analysis]
    expected_skills: [obai-crypto-routing]
    expected_outcome: success
    acceptable_outcomes: [partial_refusal]
    degraded_outcome_patterns:
      partial_refusal: '(?i)\b(?:eligibility (?:is |was )?not established|(?:job|run|backtest) (?:is |was )?not eligible|not execution[- ]grade)\b'
    date_policy: frozen
    data_contract_id: coinbase-btc-usd-daily-2025-v1
    provider_revisions_allowed: true
    tier: core
    estimated_api_calls: 6
    max_cli_turns: 1
    cost: {class: medium, max_specialist_calls: 1}
    assertions:
      required_text:
        - {regex: "\\b(?:eligible|eligibility|execution grade|blocking quality)\\b"}
        - {regex: "\\b(?:artifact|not export|cannot export)\\b"}
